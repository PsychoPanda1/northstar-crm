openapi: 3.0.3
info:
  title: Northstar CRM Public Integration API
  version: 2.3.0
  description: Public, tenant-routed contract for service landing pages. Owner records and credentials are never exposed by these endpoints.
servers:
  - url: https://crm.example.com
paths:
  /api/public/tenant:
    get:
      summary: Discover a service tenant and integration manifest
      parameters:
        - $ref: '#/components/parameters/Service'
      responses:
        '200':
          description: Tenant and versioned integration manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantManifest'
        '404':
          $ref: '#/components/responses/UnknownService'
  /api/public/catalog:
    get:
      summary: List customer-safe services
      parameters:
        - $ref: '#/components/parameters/Service'
      responses:
        '200':
          description: Active services offered by the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
        '404':
          $ref: '#/components/responses/UnknownService'
  /api/public/availability:
    get:
      summary: List available appointment slots
      parameters:
        - $ref: '#/components/parameters/Service'
        - name: days
          in: query
          schema: { type: integer, minimum: 0, maximum: 14, default: 7 }
        - name: catalogItemId
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Capacity-aware slots in the tenant timezone
          content:
            application/json:
              schema:
                type: object
                required: [slotOptions, timeZone]
                properties:
                  timeZone: { type: string }
                  slotOptions:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '404':
          $ref: '#/components/responses/UnknownService'
  /api/public/leads:
    post:
      summary: Capture a landing-page lead
      parameters:
        - $ref: '#/components/parameters/Service'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadRequest' }
      responses:
        '201': { $ref: '#/components/responses/LeadAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/bookings:
    post:
      summary: Create a customer booking
      parameters:
        - $ref: '#/components/parameters/Service'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: Booking accepted and routed to the tenant dispatch queue
          content:
            application/json:
              schema:
                type: object
                required: [id, booked, appointment, customerPortalToken]
                properties:
                  id: { type: string }
                  booked: { type: boolean }
                  appointment: { $ref: '#/components/schemas/Slot' }
                  customerPortalToken: { type: string }
                  customerPortalAccessToken: { type: string }
        '200': { $ref: '#/components/responses/Duplicate' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/job-status:
    get:
      summary: Read a customer-safe appointment status
      parameters:
        - $ref: '#/components/parameters/StatusToken'
      responses:
        '200':
          description: Customer-safe job status and reschedule choices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/job-status/reschedule:
    post:
      summary: Reschedule an appointment from a status link
      parameters:
        - $ref: '#/components/parameters/StatusToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/job-status/cancel:
    post:
      summary: Cancel an appointment from a status link
      parameters:
        - $ref: '#/components/parameters/StatusToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/job-status/calendar:
    get:
      summary: Download an appointment calendar file from a status link
      parameters:
        - $ref: '#/components/parameters/StatusToken'
      responses:
        '200': { $ref: '#/components/responses/CalendarDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/invoice/pdf:
    get:
      summary: Download a customer invoice PDF from a signed invoice link
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
      responses:
        '200':
          description: Non-cacheable invoice PDF artifact
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/invoice:
    get:
      summary: Read a customer-safe invoice from a signed invoice link
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
      responses:
        '200':
          description: Invoice balance, line items, payment history, and payment-plan status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePaymentView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/invoice/payment-intent:
    post:
      summary: Create a provider-pending payment intent from a signed invoice link
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentIntentRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal:
    get:
      summary: Read a customer-safe service portal
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
      responses:
        '200':
          description: Customer-owned appointments, requests, estimates, invoices, and service plans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPortal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/customer-portal/availability:
    get:
      summary: List customer portal booking availability
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - name: catalogItemId
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Capacity-aware slots for the selected customer-safe service
          content:
            application/json:
              schema:
                type: object
                required: [catalogItem, slots, slotOptions]
                properties:
                  catalogItem:
                    $ref: '#/components/schemas/CatalogItem'
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
                  slotOptions:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/customer-portal/book:
    post:
      summary: Book another service from the customer portal
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalBookingRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/reschedule:
    post:
      summary: Reschedule a customer-owned appointment
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RescheduleRequest'
                - type: object
                  required: [jobId]
                  properties:
                    jobId: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/cancel:
    post:
      summary: Cancel a customer-owned appointment
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CancelRequest'
                - type: object
                  required: [jobId]
                  properties:
                    jobId: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/calendar:
    get:
      summary: Download a customer-owned appointment calendar file
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - name: jobId
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/CalendarDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/customer-portal/preferences:
    get:
      summary: Read customer messaging preferences
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
      responses:
        '200':
          description: Customer-owned SMS and email preference state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Update customer messaging preferences
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPreferencesUpdate' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/request:
    post:
      summary: Submit a customer service request
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/message:
    post:
      summary: Send a customer portal message to the office
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, message]
              properties:
                channel: { type: string, enum: [SMS, Email] }
                message: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/service-plan-request:
    post:
      summary: Request a customer service-plan change for owner review
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicePlanRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/confirm:
    post:
      summary: Confirm a customer-owned appointment
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/payment-intent:
    post:
      summary: Create a provider-pending customer payment intent
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentIntentRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/financing-intent:
    post:
      summary: Submit a provider-pending financing request
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancingIntentRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/referral-link:
    get:
      summary: Create a short-lived customer referral link
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
      responses:
        '200':
          description: Signed referral link scoped to the tenant and referring customer
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresInDays, businessName]
                properties:
                  url: { type: string, format: uri }
                  expiresInDays: { type: integer, example: 30 }
                  businessName: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/referral:
    get:
      summary: Read the public referral landing context
      parameters:
        - $ref: '#/components/parameters/ReferralToken'
      responses:
        '200':
          description: Minimal tenant-safe referral context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Submit a rate-limited referral lead
      parameters:
        - $ref: '#/components/parameters/ReferralToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralRequest' }
      responses:
        '201': { $ref: '#/components/responses/LeadAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/session/services:
    get:
      summary: Discover authenticated service workspaces for the current tenant
      description: Returns only configured service aliases mapped to the authenticated owner's tenant. Use the selected service key when starting or refreshing a session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped service workspace list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionServices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/technician-job:
    get:
      summary: Read a signed technician field-service job
      parameters:
        - $ref: '#/components/parameters/TechnicianToken'
      responses:
        '200':
          description: Technician-scoped job, checklist, clock, and field-work context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TechnicianJobView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/technician-job/field-guide:
    get:
      summary: Read signed technician job field guidance
      parameters:
        - $ref: '#/components/parameters/TechnicianToken'
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/technician-job/offline-sync:
    get:
      summary: Read bounded technician offline-sync receipts for the assigned job
      parameters:
        - $ref: '#/components/parameters/TechnicianToken'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Technician-scoped batch receipts without raw action payloads
          content:
            application/json:
              schema: { type: object, required: [jobId, technician, batches], properties: { jobId: { type: string }, technician: { type: string }, batches: { type: array, items: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Replay a bounded idempotent technician offline batch
      parameters:
        - $ref: '#/components/parameters/TechnicianToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, actions]
              properties:
                batchId: { type: string, minLength: 8, maxLength: 120 }
                actions:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [id, path, method, body, idempotencyKey]
                    properties:
                      id: { type: string, minLength: 8, maxLength: 120 }
                      path: { type: string }
                      method: { type: string, enum: [POST] }
                      body: { type: object, additionalProperties: true }
                      idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
                      queuedAt: { type: string, nullable: true }
      responses:
        '200':
          description: Per-action replay statuses and durable batch receipt
          content:
            application/json:
              schema:
                type: object
                required: [batchId, duplicate, results]
                properties:
                  batchId: { type: string }
                  duplicate: { type: boolean }
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, path, status, ok]
                      properties:
                        id: { type: string }
                        path: { type: string }
                        status: { type: integer }
                        ok: { type: boolean }
                        body: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/public/technician-job/offline-sync/retry:
    post:
      summary: Retry encrypted failed technician offline actions from another device
      parameters:
        - $ref: '#/components/parameters/TechnicianToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, actionIds]
              properties:
                batchId: { type: string, minLength: 8, maxLength: 120 }
                actionIds: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
      responses:
        '200': { description: Retry batch result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/public/technician-job/status:
    post:
      summary: Advance a signed technician job through field status
      parameters:
        - $ref: '#/components/parameters/TechnicianToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
