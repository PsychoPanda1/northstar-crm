        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC
  parameters:
    Service:
      name: service
      in: query
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{2,80}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    StatusToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    CustomerToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    InvoiceToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    TechnicianToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    EstimateToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    ReviewToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    ReferralToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
  schemas:
    TechnicianStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [En route, In progress] }
        note: { type: string, maxLength: 500 }
    TechnicianClockRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [in, out] }
    TechnicianCompletionRequest:
      type: object
      required: [completionNote]
      properties:
        completionNote: { type: string, minLength: 3, maxLength: 1000 }
        customerAcknowledgedBy: { type: string, maxLength: 120 }
    TechnicianLocationRequest:
      type: object
      required: [latitude, longitude, accuracy]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, maximum: 10000 }
    TechnicianJobView:
      type: object
      description: Tenant-safe field-service payload; no owner credentials are returned.
      additionalProperties: true
    TechnicianFieldPayload:
      type: object
      description: Action-specific technician payload. The server validates each field workflow and keeps it tenant-scoped.
      additionalProperties: true
    CustomerLocationRequest:
      type: object
      required: [address]
      properties:
        address: { type: string, minLength: 5, maxLength: 180 }
        label: { type: string, minLength: 2, maxLength: 80 }
        mode: { type: string, enum: [primary, additional] }
    EstimateDecisionRequest:
      type: object
      properties:
        approverName: { type: string, maxLength: 100 }
        optionId: { type: string, maxLength: 120 }
        reason: { type: string, maxLength: 500 }
    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
    InvoicePaymentIntentRequest:
      type: object
      required: [amount, method]
      properties:
        installmentId: { type: string, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        method: { type: string, enum: [Card, ACH] }
    InvoicePaymentView:
      type: object
      required: [customer, value, amount, paidAmount, balance, status, lineItems, payments, paymentAttempts, schedule]
      properties:
        customer: { type: string }
        billTo:
          type: object
          nullable: true
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            address: { type: string }
            terms: { type: string }
        value: { type: string }
        amount: { type: number }
        paidAmount: { type: number }
        balance: { type: number }
        status: { type: string }
        due: { type: string, nullable: true }
        subtotal: { type: number }
        discount: { type: number }
        taxRate: { type: number }
        tax: { type: number }
        lineItems:
          type: array
          items:
            type: object
            required: [description, quantity, unitPrice, amount]
            properties:
              description: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }
              amount: { type: number }
        payments: { type: array, items: { type: object, additionalProperties: true } }
        paymentAttempts: { type: array, items: { type: object, additionalProperties: true } }
        schedule: { type: array, items: { type: object, additionalProperties: true } }
    SessionServices:
      type: object
      required: [tenant, items]
      properties:
        tenant:
          type: string
          description: Authenticated tenant identifier.
        items:
          type: array
          description: Service aliases available to the authenticated tenant.
          items:
            type: object
            required: [service, tenant]
            properties:
              service: { type: string }
              tenant: { type: string }
    TenantManifest:
      type: object
      required: [tenant, integration]
      properties:
        tenant:
          type: object
          required: [slug, businessName, serviceLabel, timeZone]
          properties:
            slug: { type: string }
            businessName: { type: string }
            serviceLabel: { type: string }
            timeZone: { type: string }
            contactPhone: { type: string, description: Optional public business phone for landing-page call-to-action rendering. }
            contactEmail: { type: string, format: email, description: Optional public business email for landing-page contact rendering. }
            serviceArea: { type: string, description: Optional public service-area label. }
            intakeFields:
              type: array
              maxItems: 8
              items: { $ref: '#/components/schemas/IntakeField' }
        integration:
          type: object
            required: [version, leadEndpoint, bookingEndpoint, availabilityEndpoint, ownerAuthMethods]
          properties:
            version: { type: integer, example: 2 }
            leadEndpoint: { type: string }
            bookingEndpoint: { type: string }
            availabilityEndpoint: { type: string }
            ownerPortalPath: { type: string }
            ownerAuthEndpoint: { type: string }
            ownerAuthRefreshEndpoint: { type: string }
            ownerAuthLogoutEndpoint: { type: string }
            ownerAuthMethods:
              type: array
              description: Available owner authentication methods for this tenant. OIDC is present only when a verified tenant-bound OIDC owner is provisioned.
              items: { type: string, enum: [password, oidc] }
              minItems: 1
              uniqueItems: true
            ownerOidcAuthEndpoint: { type: string, nullable: true }
            technicianFieldEstimateEndpoint: { type: string }
            technicianLocationEndpoint: { type: string }
            technicianEndpoints:
              type: object
              description: Copyable signed technician field-operation endpoints for the tenant's mobile workspace.
              required: [job, fieldGuide, offlineSync, status, visitStatus, clock, customerContext, checklist, photo, finding, form, asset, labor, materials, estimate, paymentIntent, complete, location]
              properties:
                job: { type: string }
                fieldGuide: { type: string }
                offlineSync: { type: string }
                status: { type: string }
                visitStatus: { type: string }
                clock: { type: string }
                customerContext: { type: string }
                checklist: { type: string }
                photo: { type: string }
                finding: { type: string }
                form: { type: string }
                asset: { type: string }
                labor: { type: string }
                materials: { type: string }
                estimate: { type: string }
                paymentIntent: { type: string }
                complete: { type: string }
                location: { type: string }
            customerPortalEndpoints:
              type: object
              required: [availability, book, calendar, reschedule, cancel, confirm, estimatePdf, financingIntent, location, message, paymentIntent, preferences, referralLink, request, servicePlanRequest]
              properties:
                availability: { type: string }
                book: { type: string }
                calendar: { type: string }
                reschedule: { type: string }
                cancel: { type: string }
                confirm: { type: string }
                estimatePdf: { type: string }
                financingIntent: { type: string }
                location: { type: string }
                message: { type: string }
                paymentIntent: { type: string }
                preferences: { type: string }
                referralLink: { type: string }
                request: { type: string }
                servicePlanRequest: { type: string }
            statusEndpoints:
              type: object
              additionalProperties: { type: string }
            estimateEndpoints:
              type: object
              required: [view, pdf, media, approve, decline, requestChange]
              properties:
                view: { type: string }
                pdf: { type: string }
                media: { type: string }
                approve: { type: string }
                decline: { type: string }
                requestChange: { type: string }
            reviewEndpoint: { type: string }
            capabilities:
              type: object
              additionalProperties: { type: boolean }
    CatalogItem:
      type: object
      required: [id, name, description, priceFrom, durationMinutes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceFrom: { type: string }
        durationMinutes: { type: integer, minimum: 15 }
        category: { type: string }
    Slot:
      type: object
      required: [id, label, startsAt, endsAt, timeZone]
      properties:
        id: { type: string }
        label: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string }
    IntakeField:
      type: object
      required: [id, type, label, required]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        type: { type: string, enum: [text, textarea, select, checkbox] }
        label: { type: string, minLength: 2, maxLength: 100 }
        required: { type: boolean }
        options:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 80 }
    LeadRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, format: email, maxLength: 120 }
        requestedService: { type: string, maxLength: 80 }
        location: { type: string, maxLength: 120 }
        message: { type: string, maxLength: 500 }
        source: { type: string, maxLength: 80 }
        website: { type: string, maxLength: 120, description: Leave empty; honeypot field. }
        intakeAnswers:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: boolean }] }
    BookingRequest:
      allOf:
        - $ref: '#/components/schemas/LeadRequest'
        - type: object
          required: [location]
          properties:
            slotId: { type: string, maxLength: 120 }
            time: { type: string, maxLength: 120 }
            catalogItemId: { type: string, maxLength: 120 }
            checklist:
              type: array
              maxItems: 12
              items: { type: string, minLength: 2, maxLength: 120 }
    PortalBookingRequest:
      type: object
      required: [service, slotId]
      properties:
        service: { type: string, minLength: 2, maxLength: 100 }
        catalogItemId: { type: string, maxLength: 120 }
        slotId: { type: string, maxLength: 120 }
        locationId: { type: string, maxLength: 160, description: Customer-owned saved service location; omitted uses the primary location. }
        intakeAnswers:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: boolean }] }
    RescheduleRequest:
      type: object
      required: [slotId]
      properties:
        slotId: { type: string, maxLength: 120 }
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }
    CustomerPreferencesState:
      type: object
      required: [smsOptOut, emailOptOut]
      properties:
        smsOptOut: { type: boolean }
        emailOptOut: { type: boolean }
    CustomerPreferencesResponse:
      type: object
      required: [contactPreferences]
      properties:
        contactPreferences: { $ref: '#/components/schemas/CustomerPreferencesState' }
    CustomerPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        smsOptOut: { type: boolean }
        emailOptOut: { type: boolean }
    CustomerRequest:
      type: object
      required: [type, message]
      properties:
        jobId: { type: string, maxLength: 120 }
        type: { type: string, enum: [Reschedule request, Cancellation request, Question] }
        priority: { type: string, enum: [Low, Normal, High, Urgent], default: Normal }
        message: { type: string, minLength: 3, maxLength: 500 }
    ServicePlanRequest:
      type: object
      required: [service, action, note]
      properties:
        service: { type: string, maxLength: 120 }
        action: { type: string, enum: [pause, cancel, change] }
        note: { type: string, minLength: 3, maxLength: 500 }
    PaymentIntentRequest:
      type: object
      required: [invoiceId, amount, method]
      properties:
        invoiceId: { type: string, maxLength: 120 }
        installmentId: { type: string, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        method: { type: string, enum: [Card, ACH] }
    FinancingIntentRequest:
      type: object
      required: [amount, termMonths]
      properties:
        estimateId: { type: string, maxLength: 120 }
        invoiceId: { type: string, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        termMonths: { type: integer, enum: [6, 12, 18, 24, 36, 48, 60] }
        provider: { type: string, maxLength: 100 }
    ReferralContext:
      type: object
      required: [businessName, serviceLabel]
      properties:
        businessName: { type: string }
        serviceLabel: { type: string }
    ReferralRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, format: email, maxLength: 120 }
        message: { type: string, maxLength: 500 }
        website: { type: string, maxLength: 120, description: Leave empty; honeypot field. }
    JobStatus:
      type: object
      required: [service, status, time, availableRescheduleSlots]
      properties:
        service: { type: string }
        location: { type: string }
        status: { type: string }
        time: { type: string }
        availableRescheduleSlots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
    CustomerPortal:
      type: object
      required: [customer, jobs, catalog]
      properties:
        customer: { type: object }
        catalog:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        jobs:
          type: array
          items: { type: object }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              invoicePdfUrl: { type: string, format: uri }
              invoicePdfLinkExpiresInHours: { type: integer, example: 72 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string }
    Duplicate:
      type: object
      required: [duplicate]
      properties: { duplicate: { type: boolean, enum: [true] } }
  responses:
    UnknownService:
      description: Service key is not configured
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid signed customer token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Customer or catalog item was not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MutationAccepted:
      description: Mutation was accepted
      content: { application/json: { schema: { type: object, additionalProperties: true } } }
    ValidationError:
      description: Request failed bounded validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IdempotencyConflict:
      description: Idempotency key was reused with a different payload
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Client/service mutation rate limit exceeded; retry after the advertised delay.
      headers:
        Retry-After:
          schema: { type: integer, example: 60 }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CalendarDownload:
      description: iCalendar appointment download
      headers:
        Cache-Control:
          schema: { type: string, example: no-store }
        Content-Disposition:
          schema: { type: string }
      content:
        text/calendar:
          schema: { type: string, format: binary }
    LeadAccepted:
      description: Lead accepted
      content: { application/json: { schema: { type: object, required: [id, received], properties: { id: { type: string }, received: { type: boolean } } } } }
