openapi: 3.0.3
info:
  title: Northstar CRM Public Integration API
  version: 2.4.0
  description: Public, tenant-routed contract for service landing pages. Owner records and credentials are never exposed by these endpoints.
servers:
  - url: https://crm.example.com
paths:
  /api/public/tenant:
    get:
      summary: Discover a service tenant and integration manifest
      parameters:
        - $ref: '#/components/parameters/Service'
      responses:
        '200':
          description: Tenant and versioned integration manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantManifest'
        '404':
          $ref: '#/components/responses/UnknownService'
  /api/public/catalog:
    get:
      summary: List customer-safe services
      parameters:
        - $ref: '#/components/parameters/Service'
      responses:
        '200':
          description: Active services offered by the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CatalogItem'
        '404':
          $ref: '#/components/responses/UnknownService'
  /api/public/availability:
    get:
      summary: List available appointment slots
      parameters:
        - $ref: '#/components/parameters/Service'
        - name: days
          in: query
          schema: { type: integer, minimum: 0, maximum: 14, default: 7 }
        - name: catalogItemId
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Capacity-aware slots in the tenant timezone
          content:
            application/json:
              schema:
                type: object
                required: [slotOptions, timeZone]
                properties:
                  timeZone: { type: string }
                  slotOptions:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '404':
          $ref: '#/components/responses/UnknownService'
  /api/public/leads:
    post:
      summary: Capture a landing-page lead
      parameters:
        - $ref: '#/components/parameters/Service'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadRequest' }
      responses:
        '201': { $ref: '#/components/responses/LeadAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/bookings:
    post:
      summary: Create a customer booking
      parameters:
        - $ref: '#/components/parameters/Service'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRequest' }
      responses:
        '201':
          description: Booking accepted and routed to the tenant dispatch queue
          content:
            application/json:
              schema:
                type: object
                required: [id, booked, appointment, customerPortalToken]
                properties:
                  id: { type: string }
                  booked: { type: boolean }
                  appointment: { $ref: '#/components/schemas/Slot' }
                  customerPortalToken: { type: string }
                  customerPortalAccessToken: { type: string }
        '200': { $ref: '#/components/responses/Duplicate' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/job-status:
    get:
      summary: Read a customer-safe appointment status
      parameters:
        - $ref: '#/components/parameters/StatusToken'
      responses:
        '200':
          description: Customer-safe job status and reschedule choices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/job-status/reschedule:
    post:
      summary: Reschedule an appointment from a status link
      parameters:
        - $ref: '#/components/parameters/StatusToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/job-status/cancel:
    post:
      summary: Cancel an appointment from a status link
      parameters:
        - $ref: '#/components/parameters/StatusToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/job-status/calendar:
    get:
      summary: Download an appointment calendar file from a status link
      parameters:
        - $ref: '#/components/parameters/StatusToken'
      responses:
        '200': { $ref: '#/components/responses/CalendarDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/invoice/pdf:
    get:
      summary: Download a customer invoice PDF from a signed invoice link
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
      responses:
        '200':
          description: Non-cacheable invoice PDF artifact
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/customer-portal:
    get:
      summary: Read a customer-safe service portal
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
      responses:
        '200':
          description: Customer-owned appointments, requests, estimates, invoices, and service plans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPortal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/customer-portal/availability:
    get:
      summary: List customer portal booking availability
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - name: catalogItemId
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Capacity-aware slots for the selected customer-safe service
          content:
            application/json:
              schema:
                type: object
                required: [catalogItem, slots, slotOptions]
                properties:
                  catalogItem:
                    $ref: '#/components/schemas/CatalogItem'
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
                  slotOptions:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/customer-portal/book:
    post:
      summary: Book another service from the customer portal
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalBookingRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/reschedule:
    post:
      summary: Reschedule a customer-owned appointment
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RescheduleRequest'
                - type: object
                  required: [jobId]
                  properties:
                    jobId: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/cancel:
    post:
      summary: Cancel a customer-owned appointment
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CancelRequest'
                - type: object
                  required: [jobId]
                  properties:
                    jobId: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/calendar:
    get:
      summary: Download a customer-owned appointment calendar file
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - name: jobId
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/CalendarDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/public/customer-portal/preferences:
    get:
      summary: Read customer messaging preferences
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
      responses:
        '200':
          description: Customer-owned SMS and email preference state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Update customer messaging preferences
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPreferencesUpdate' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/request:
    post:
      summary: Submit a customer service request
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/message:
    post:
      summary: Send a customer portal message to the office
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, message]
              properties:
                channel: { type: string, enum: [SMS, Email] }
                message: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/service-plan-request:
    post:
      summary: Request a customer service-plan change for owner review
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicePlanRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/confirm:
    post:
      summary: Confirm a customer-owned appointment
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId: { type: string, maxLength: 120 }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/payment-intent:
    post:
      summary: Create a provider-pending customer payment intent
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentIntentRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/financing-intent:
    post:
      summary: Submit a provider-pending financing request
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancingIntentRequest' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/public/customer-portal/referral-link:
    get:
      summary: Create a short-lived customer referral link
      parameters:
        - $ref: '#/components/parameters/CustomerToken'
      responses:
        '200':
          description: Signed referral link scoped to the tenant and referring customer
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresInDays, businessName]
                properties:
                  url: { type: string, format: uri }
                  expiresInDays: { type: integer, example: 30 }
                  businessName: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/public/referral:
    get:
      summary: Read the public referral landing context
      parameters:
        - $ref: '#/components/parameters/ReferralToken'
      responses:
        '200':
          description: Minimal tenant-safe referral context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Submit a rate-limited referral lead
      parameters:
        - $ref: '#/components/parameters/ReferralToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralRequest' }
      responses:
        '201': { $ref: '#/components/responses/LeadAccepted' }
        '200': { $ref: '#/components/responses/Duplicate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/session/services:
    get:
      summary: Discover authenticated service workspaces for the current tenant
      description: Returns only configured service aliases mapped to the authenticated owner's tenant. Use the selected service key when starting or refreshing a session.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tenant-scoped service workspace list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionServices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OIDC
  parameters:
    Service:
      name: service
      in: query
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{2,80}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    StatusToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    CustomerToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    InvoiceToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
    ReferralToken:
      name: token
      in: query
      required: true
      schema: { type: string, minLength: 20, maxLength: 400 }
  schemas:
    SessionServices:
      type: object
      required: [tenant, items]
      properties:
        tenant:
          type: string
          description: Authenticated tenant identifier.
        items:
          type: array
          description: Service aliases available to the authenticated tenant.
          items:
            type: object
            required: [service, tenant]
            properties:
              service: { type: string }
              tenant: { type: string }
    TenantManifest:
      type: object
      required: [tenant, integration]
      properties:
        tenant:
          type: object
          required: [slug, businessName, serviceLabel, timeZone]
          properties:
            slug: { type: string }
            businessName: { type: string }
            serviceLabel: { type: string }
            timeZone: { type: string }
            contactPhone: { type: string, description: Optional public business phone for landing-page call-to-action rendering. }
            contactEmail: { type: string, format: email, description: Optional public business email for landing-page contact rendering. }
            serviceArea: { type: string, description: Optional public service-area label. }
            intakeFields:
              type: array
              maxItems: 8
              items: { $ref: '#/components/schemas/IntakeField' }
        integration:
          type: object
            required: [version, leadEndpoint, bookingEndpoint, availabilityEndpoint, ownerAuthMethods]
          properties:
            version: { type: integer, example: 2 }
            leadEndpoint: { type: string }
            bookingEndpoint: { type: string }
            availabilityEndpoint: { type: string }
            ownerPortalPath: { type: string }
            ownerAuthEndpoint: { type: string }
            ownerAuthRefreshEndpoint: { type: string }
            ownerAuthLogoutEndpoint: { type: string }
            ownerAuthMethods:
              type: array
              description: Available owner authentication methods for this tenant. OIDC is present only when a verified tenant-bound OIDC owner is provisioned.
              items: { type: string, enum: [password, oidc] }
              minItems: 1
              uniqueItems: true
            ownerOidcAuthEndpoint: { type: string, nullable: true }
    CatalogItem:
      type: object
      required: [id, name, description, priceFrom, durationMinutes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceFrom: { type: string }
        durationMinutes: { type: integer, minimum: 15 }
        category: { type: string }
    Slot:
      type: object
      required: [id, label, startsAt, endsAt, timeZone]
      properties:
        id: { type: string }
        label: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone: { type: string }
    IntakeField:
      type: object
      required: [id, type, label, required]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        type: { type: string, enum: [text, textarea, select, checkbox] }
        label: { type: string, minLength: 2, maxLength: 100 }
        required: { type: boolean }
        options:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 80 }
    LeadRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, format: email, maxLength: 120 }
        requestedService: { type: string, maxLength: 80 }
        location: { type: string, maxLength: 120 }
        message: { type: string, maxLength: 500 }
        source: { type: string, maxLength: 80 }
        website: { type: string, maxLength: 120, description: Leave empty; honeypot field. }
        intakeAnswers:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: boolean }] }
    BookingRequest:
      allOf:
        - $ref: '#/components/schemas/LeadRequest'
        - type: object
          required: [location]
          properties:
            slotId: { type: string, maxLength: 120 }
            time: { type: string, maxLength: 120 }
            catalogItemId: { type: string, maxLength: 120 }
            checklist:
              type: array
              maxItems: 12
              items: { type: string, minLength: 2, maxLength: 120 }
    PortalBookingRequest:
      type: object
      required: [service, slotId]
      properties:
        service: { type: string, minLength: 2, maxLength: 100 }
        catalogItemId: { type: string, maxLength: 120 }
        slotId: { type: string, maxLength: 120 }
        locationId: { type: string, maxLength: 160, description: Customer-owned saved service location; omitted uses the primary location. }
        intakeAnswers:
          type: object
          additionalProperties: { oneOf: [{ type: string }, { type: boolean }] }
    RescheduleRequest:
      type: object
      required: [slotId]
      properties:
        slotId: { type: string, maxLength: 120 }
    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }
    CustomerPreferencesState:
      type: object
      required: [smsOptOut, emailOptOut]
      properties:
        smsOptOut: { type: boolean }
        emailOptOut: { type: boolean }
    CustomerPreferencesResponse:
      type: object
      required: [contactPreferences]
      properties:
        contactPreferences: { $ref: '#/components/schemas/CustomerPreferencesState' }
    CustomerPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        smsOptOut: { type: boolean }
        emailOptOut: { type: boolean }
    CustomerRequest:
      type: object
      required: [type, message]
      properties:
        jobId: { type: string, maxLength: 120 }
        type: { type: string, enum: [Reschedule request, Cancellation request, Question] }
        priority: { type: string, enum: [Low, Normal, High, Urgent], default: Normal }
        message: { type: string, minLength: 3, maxLength: 500 }
    ServicePlanRequest:
      type: object
      required: [service, action, note]
      properties:
        service: { type: string, maxLength: 120 }
        action: { type: string, enum: [pause, cancel, change] }
        note: { type: string, minLength: 3, maxLength: 500 }
    PaymentIntentRequest:
      type: object
      required: [invoiceId, amount, method]
      properties:
        invoiceId: { type: string, maxLength: 120 }
        installmentId: { type: string, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        method: { type: string, enum: [Card, ACH] }
    FinancingIntentRequest:
      type: object
      required: [amount, termMonths]
      properties:
        estimateId: { type: string, maxLength: 120 }
        invoiceId: { type: string, maxLength: 120 }
        amount: { type: number, exclusiveMinimum: 0 }
        termMonths: { type: integer, enum: [6, 12, 18, 24, 36, 48, 60] }
        provider: { type: string, maxLength: 100 }
    ReferralContext:
      type: object
      required: [businessName, serviceLabel]
      properties:
        businessName: { type: string }
        serviceLabel: { type: string }
    ReferralRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, format: email, maxLength: 120 }
        message: { type: string, maxLength: 500 }
        website: { type: string, maxLength: 120, description: Leave empty; honeypot field. }
    JobStatus:
      type: object
      required: [service, status, time, availableRescheduleSlots]
      properties:
        service: { type: string }
        location: { type: string }
        status: { type: string }
        time: { type: string }
        availableRescheduleSlots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
    CustomerPortal:
      type: object
      required: [customer, jobs, catalog]
      properties:
        customer: { type: object }
        catalog:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        jobs:
          type: array
          items: { type: object }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              invoicePdfUrl: { type: string, format: uri }
              invoicePdfLinkExpiresInHours: { type: integer, example: 72 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        requestId: { type: string }
    Duplicate:
      type: object
      required: [duplicate]
      properties: { duplicate: { type: boolean, enum: [true] } }
  responses:
    UnknownService:
      description: Service key is not configured
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid signed customer token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Customer or catalog item was not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MutationAccepted:
      description: Mutation was accepted
      content: { application/json: { schema: { type: object, additionalProperties: true } } }
    ValidationError:
      description: Request failed bounded validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IdempotencyConflict:
      description: Idempotency key was reused with a different payload
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Client/service mutation rate limit exceeded; retry after the advertised delay.
      headers:
        Retry-After:
          schema: { type: integer, example: 60 }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    CalendarDownload:
      description: iCalendar appointment download
      headers:
        Cache-Control:
          schema: { type: string, example: no-store }
        Content-Disposition:
          schema: { type: string }
      content:
        text/calendar:
          schema: { type: string, format: binary }
    LeadAccepted:
      description: Lead accepted
      content: { application/json: { schema: { type: object, required: [id, received], properties: { id: { type: string }, received: { type: boolean } } } } }
