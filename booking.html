<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book service · Northstar</title>
  <style>:root{font-family:Inter,system-ui,sans-serif;color:#193044;background:#f5f8f7}body{margin:0;padding:24px}.card{max-width:560px;margin:5vh auto;background:#fff;border:1px solid #e1e9e6;border-radius:18px;padding:28px;box-shadow:0 18px 50px #19304412}h1{margin:8px 0;font-size:28px}.intro{color:#71827d;line-height:1.5}.eyebrow{color:#23845d;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}label{display:block;color:#53655f;font-size:12px;font-weight:700;margin-top:15px}input,select{width:100%;box-sizing:border-box;border:1px solid #dce7e3;border-radius:9px;padding:11px;margin-top:6px;font:inherit;background:#fff}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.slot{margin:0;background:#f0f7f3;color:#237b5b;border:1px solid #d8e9e0}.slot.selected{background:#23845d;color:#fff;border-color:#23845d}.submit{width:100%;border:0;border-radius:9px;background:#23845d;color:#fff;font:inherit;font-weight:800;padding:13px;margin-top:22px;cursor:pointer}.submit:disabled,.slot:disabled{opacity:.55;cursor:wait}#message{color:#71827d;line-height:1.5;margin-top:16px}.success{color:#237b5b!important}</style>
</head>
<body><main class="card"><div class="eyebrow">NORTHSTAR ONLINE BOOKING</div><h1 id="title">Book your service</h1><p class="intro" id="intro">Choose a time that works and we’ll send your request to the service team.</p><form id="booking-form"><label>Name<input name="name" required maxlength="100" autocomplete="name" /></label><label>Phone or email<input name="contact" required maxlength="120" autocomplete="email" /></label><label>Service address<input name="location" required minlength="5" maxlength="120" autocomplete="street-address" /></label><label>Service<select name="catalogItemId" id="service-select"><option value="">Loading services…</option></select></label><label>Requested service<input name="requestedService" maxlength="100" placeholder="Describe what you need" /></label><div id="intake-fields" aria-live="polite"></div><label>Available time<div class="slots" id="slots"><span>Loading times…</span></div></label><button class="submit" type="submit">Request this appointment</button></form><div id="message" role="status" aria-live="polite"></div></main>
<script src="/landing-page-client.js"></script>
<script>
const params=new URLSearchParams(location.search);const service=params.get('service')||'default';const northstar=new NorthstarLandingClient({service});const form=document.querySelector('#booking-form');const slots=document.querySelector('#slots');const message=document.querySelector('#message');let selectedTime='';let selectedSlotId='';const loadAvailability=async(catalogItemId='')=>{selectedTime='';selectedSlotId='';slots.textContent='Loading times…';const body=await northstar.availability({days:7,catalogItemId});document.querySelector('#title').textContent='Book '+body.tenant.serviceLabel;document.querySelector('#intro').textContent='Choose a '+(body.catalogItem?.durationMinutes||body.tenant.appointmentMinutes||60)+'-minute appointment window for '+body.tenant.businessName+'.';const options=body.slotOptions||body.slots.map((label)=>({label}));slots.innerHTML=options.map((slot)=>`<button class="slot" type="button" data-time="${esc(slot.label)}" data-slot-id="${esc(slot.id||'')}">${esc(slot.label)}</button>`).join('');slots.querySelectorAll('.slot').forEach((button)=>button.onclick=()=>{selectedTime=button.dataset.time;selectedSlotId=button.dataset.slotId;slots.querySelectorAll('.slot').forEach((item)=>item.classList.toggle('selected',item===button))});};const esc=(value)=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const setMessage=(value,success=false)=>{message.className=success?'success':'';message.innerHTML=value};
northstar.catalog().then(async(body)=>{const select=document.querySelector('#service-select');const items=body.items||[];select.innerHTML='<option value="">Choose a service</option>'+items.map((item)=>'<option value="'+esc(item.id)+'">'+esc(item.name)+' · '+esc(item.durationMinutes||60)+' min · '+esc(item.priceFrom||'Price pending')+'</option>').join('');select.onchange=()=>loadAvailability(select.value);await loadAvailability(select.value)}).catch(()=>{document.querySelector('#service-select').innerHTML='<option value="">General service</option>';return loadAvailability()}).catch(()=>{slots.textContent='Availability is temporarily unavailable.';});
form.onsubmit=async(event)=>{event.preventDefault();if(!selectedTime){setMessage('Choose an available time first.');return}const contact=form.elements.contact.value.trim();const body={service,name:form.elements.name.value.trim(),location:form.elements.location.value.trim(),requestedService:form.elements.requestedService.value.trim(),catalogItemId:form.elements.catalogItemId.value||'',time:selectedTime,...(selectedSlotId?{slotId:selectedSlotId}:{}),...Object.fromEntries(['utm_source','utm_medium','utm_campaign','utm_content','gclid','fbclid'].filter((key)=>params.get(key)).map((key)=>[key,params.get(key)])),source:`${service} landing page booking`,website:''};if(contact.includes('@'))body.email=contact;else body.phone=contact;const submit=form.querySelector('.submit');submit.disabled=true;const storageKey='northstar-booking-retry-'+service+'-'+JSON.stringify(body);const storedKey=sessionStorage.getItem(storageKey);const bookingKey=storedKey||crypto.randomUUID();if(!storedKey)sessionStorage.setItem(storageKey,bookingKey);try{const result=await northstar.book(body,{idempotencyKey:bookingKey});form.hidden=true;setMessage(`Appointment request received for ${esc(result.tenant.businessName)}. <a href="status.html?token=${encodeURIComponent(result.customerPortalToken)}">View appointment status</a>.`,true)}catch{setMessage('We could not submit the booking. Please try again.');submit.disabled=false}};
</script><script>const ownerLink=document.createElement('a');ownerLink.textContent='Owner sign in';ownerLink.rel='nofollow';ownerLink.style='color:#237b5b;font-size:12px';const ownerLinkWrap=document.createElement('p');ownerLinkWrap.style='margin:18px 0 0;text-align:center';ownerLinkWrap.append(ownerLink);document.querySelector('main').append(ownerLinkWrap);northstar.ownerPortalUrl().then((url)=>{ownerLink.href=url}).catch(()=>{ownerLinkWrap.hidden=true});</script><script>(async()=>{const container=document.querySelector('#intake-fields');if(!container)return;const safe=(value)=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));try{const manifest=await northstar.manifest();const fields=manifest.tenant?.intakeFields||[];container.innerHTML=fields.map((field)=>{const required=field.required?' required':'';if(field.type==='select')return '<label>'+safe(field.label)+'<select name="intake-'+safe(field.id)+'" data-intake-id="'+safe(field.id)+'"'+required+'><option value="">Choose one</option>'+field.options.map((option)=>'<option value="'+safe(option)+'">'+safe(option)+'</option>').join('')+'</select></label>';if(field.type==='checkbox')return '<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" data-intake-id="'+safe(field.id)+'"'+required+' />'+safe(field.label)+'</label>';return '<label>'+safe(field.label)+(field.type==='textarea'?'<textarea name="intake-'+safe(field.id)+'" data-intake-id="'+safe(field.id)+'" maxlength="500"'+required+'></textarea>':'<input name="intake-'+safe(field.id)+'" data-intake-id="'+safe(field.id)+'" maxlength="160"'+required+' />')+'</label>';}).join('');const originalBook=northstar.book.bind(northstar);northstar.book=(payload,options)=>{const intakeAnswers=Object.fromEntries([...container.querySelectorAll('[data-intake-id]')].map((input)=>[input.dataset.intakeId,input.type==='checkbox'?input.checked:input.value.trim()]).filter(([,value])=>value!==''&&value!==false));return originalBook({...payload,intakeAnswers},options)};}catch{container.hidden=true;}})();</script></body>
</html>
