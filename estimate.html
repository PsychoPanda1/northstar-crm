<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review estimate · Northstar</title>
    <style>:root{font-family:Inter,system-ui,sans-serif;color:#193044;background:#f5f8f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:#fff;border:1px solid #e1e9e6;border-radius:18px;padding:32px;box-shadow:0 18px 50px #19304412}.brand{color:#23845d;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.kicker{color:#879994;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:28px 0 8px}h1{margin:0 0 18px;font-size:28px}.detail{border-top:1px solid #edf1ef;border-bottom:1px solid #edf1ef;padding:18px 0;display:grid;gap:15px}.detail div{display:flex;justify-content:space-between;gap:20px}.detail span{color:#879994;font-size:13px}.detail strong{text-align:right;font-size:14px}.total{font-size:24px;color:#23845d}.button{border:0;border-radius:9px;background:#23845d;color:#fff;font:inherit;font-weight:700;padding:13px 18px;margin-top:24px;width:100%;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.message{color:#71827d;font-size:14px;line-height:1.55}.error{color:#ad4c4c}</style>
  </head>
  <body><main class="card" aria-live="polite"><div class="brand">Northstar service cloud</div><div id="content"><div class="kicker">Customer estimate</div><h1>Loading your estimate…</h1></div></main>
    <script>
      const content=document.querySelector('#content'); const token=new URLSearchParams(location.search).get('token'); const retryKey=(scope,body)=>{const storageKey=`northstar-estimate-retry-${token}-${scope}-${JSON.stringify(body)}`;const stored=sessionStorage.getItem(storageKey);if(stored)return stored;const next=crypto.randomUUID();sessionStorage.setItem(storageKey,next);return next}; const escapeHtml=(value)=>String(value??'').replace(/[&<>'"]/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const showError=()=>{content.innerHTML='<div class="kicker">Customer estimate</div><h1>Link unavailable</h1><p class="message error">This estimate link has expired or is no longer available. Please contact the service team.</p>';};
      if(!token) showError(); else fetch(`/api/public/estimate?token=${encodeURIComponent(token)}`).then(async(response)=>{const body=await response.json();if(!response.ok)throw new Error(body.error);const options=(body.options||[]).map((option,index)=>`<label style="display:block;border:1px solid #e1e9e6;border-radius:10px;padding:12px;margin-top:9px;cursor:pointer"><input type="radio" name="estimate-option" value="${escapeHtml(option.id)}" ${index===0?'checked':''}/> <strong>${escapeHtml(option.label)}</strong><small style="display:block;color:#71827d;margin:5px 0 0 23px">${escapeHtml(option.description)} · $${escapeHtml(option.amount)}</small></label>`).join('');content.innerHTML=`<div class="kicker">Estimate for ${escapeHtml(body.customer)}</div><h1>${escapeHtml(body.service)}</h1><div class="detail"><div><span>Total</span><strong class="total">${escapeHtml(body.value)}</strong></div><div><span>Status</span><strong id="estimate-status">${escapeHtml(body.status)}</strong></div></div>${options?`<div style="margin-top:18px"><strong>Choose your service option</strong>${options}</div>`:''}${body.status==='Draft'?'<button class="button" id="approve">Approve estimate</button>':'<p class="message">This estimate has already been reviewed. We’ll keep the service team updated.</p>'}`;const approve=document.querySelector('#approve');if(approve)approve.addEventListener('click',async()=>{approve.disabled=true;try{const selected=document.querySelector('input[name="estimate-option"]:checked')?.value;const approverName=(prompt('Your name for approval')||'').trim();if(approverName.length<2){approve.disabled=false;return;}const result=await fetch(`/api/public/estimate/approve?token=${encodeURIComponent(token)}`,{method:'POST',headers:{'content-type':'application/json','idempotency-key':retryKey('approve',selected?{optionId:selected,approverName}:{approverName})},body:JSON.stringify(selected?{optionId:selected,approverName}:{approverName})});const updated=await result.json();if(!result.ok)throw new Error(updated.error);document.querySelector('#estimate-status').textContent=updated.status;approve.remove();content.insertAdjacentHTML('beforeend','<p class="message">Thanks—your approval was sent to the service team.</p>');}catch{approve.disabled=false;approve.textContent='Try again';}});}).catch(showError);
    </script>
  </body>
</html>
<script>setTimeout(()=>{const token=new URLSearchParams(location.search).get('token');const approve=document.querySelector('#approve');const content=document.querySelector('#content');if(!token||!approve||!content||document.querySelector('#decline'))return;const button=document.createElement('button');button.id='decline';button.className='button secondary';button.textContent='Decline estimate';button.style.marginLeft='8px';button.onclick=async()=>{const reason=prompt('Why are you declining this estimate?');if(!reason?.trim())return;button.disabled=true;const response=await fetch('/api/public/estimate/decline?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reason:reason.trim()})});if(response.ok){document.querySelector('#estimate-status').textContent='Declined';approve.remove();button.remove();content.insertAdjacentHTML('beforeend','<p class="message">Thanks for the feedback. The service team has been notified.</p>')}else{button.disabled=false;button.textContent='Try again'} };approve.after(button)},900);</script>
<script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;const response=await fetch('/api/public/estimate?token='+encodeURIComponent(token));if(!response.ok)return;const estimate=await response.json();if(!estimate.lineItems?.length)return;const detail=document.querySelector('.detail');if(!detail)return;const section=document.createElement('div');section.style='border-top:1px solid #edf1ef;margin-top:18px;padding-top:14px';const heading=document.createElement('strong');heading.textContent='Estimate details';section.append(heading);estimate.lineItems.forEach((item)=>{const row=document.createElement('div');row.style='display:flex;justify-content:space-between;gap:16px;margin-top:8px;font-size:13px';const label=document.createElement('span');label.textContent=`${item.description} · ${item.quantity} × $${Number(item.unitPrice).toFixed(2)}`;const amount=document.createElement('strong');amount.textContent='$'+Number(item.amount).toFixed(2);row.append(label,amount);section.append(row)});detail.after(section)},900);</script>
