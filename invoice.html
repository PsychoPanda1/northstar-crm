<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Northstar payment</title><style>body{margin:0;background:#f4f7fb;color:#17212b;font:16px system-ui,sans-serif}.wrap{max-width:560px;margin:8vh auto;padding:28px}.card{background:#fff;border:1px solid #dce5ee;border-radius:18px;padding:28px;box-shadow:0 12px 40px #17324d12}h1{margin:4px 0 8px}p{color:#607080}label{display:block;margin:18px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd7e2;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;margin:18px 8px 0 0;background:#176b87;color:#fff;font:inherit;cursor:pointer}button.secondary{background:#edf3f7;color:#176b87}.amount{font-size:32px;font-weight:750}.schedule{margin:20px 0;padding:14px;background:#f4f8fb;border-radius:12px}.schedule h2{font-size:14px;margin:0 0 8px}.schedule-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #dce5ee;font-size:13px}.schedule-row small{color:#607080}.message{min-height:24px;color:#176b87}</style></head>
<body><main class="wrap"><section class="card"><p>Northstar secure payment handoff</p><h1 id="customer">Invoice payment</h1><div class="amount" id="balance">Loading…</div><p id="details"></p><p id="breakdown" style="margin:8px 0;color:#176b87;font-weight:600"></p><div class="schedule" id="schedule" hidden><h2>Payment plan</h2><div id="schedule-items"></div></div><label for="amount">Payment amount</label><input id="amount" type="number" min="0.01" step="0.01" /><div><button data-method="Card">Pay by card</button><button class="secondary" data-method="ACH">Pay by ACH</button></div><p class="message" id="message"></p></section></main><script>const token=new URLSearchParams(location.search).get('token');const query=token?'?token='+encodeURIComponent(token):'';const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){if(!token){message.textContent='This payment link is missing.';return}const response=await fetch('/api/public/invoice'+query);if(!response.ok){message.textContent='This payment link is invalid or expired.';return}const invoice=await response.json();customer.textContent=invoice.customer;balance.textContent='$'+Number(invoice.balance).toFixed(2)+' due';details.textContent=`Invoice ${invoice.value} · Due ${invoice.due||'on receipt'} · ${invoice.status}`;const paid=Math.max(0,Number(invoice.paidAmount||0));breakdown.textContent=`Total ${Number(invoice.amount||0).toFixed(2)} · Paid ${paid.toFixed(2)} · Remaining ${Number(invoice.balance||0).toFixed(2)}`;amount.value=Number(invoice.balance).toFixed(2);if(invoice.schedule?.length){schedule.hidden=false;scheduleItems.innerHTML=invoice.schedule.map((item)=>`<div class="schedule-row"><span>Payment ${item.sequence}<br><small>${esc(item.due)}</small></span><strong>$${Number(item.amount).toFixed(2)} · ${esc(item.status)}</strong></div>`).join('')}if(invoice.status==='Paid')message.textContent='This invoice is already paid.'}document.querySelectorAll('button[data-method]').forEach((button)=>button.onclick=async()=>{button.disabled=true;const response=await fetch('/api/public/invoice/payment-intent'+query,{method:'POST',headers:{'content-type':'application/json','idempotency-key':crypto.randomUUID()},body:JSON.stringify({amount:Number(amount.value),method:button.dataset.method})});const result=await response.json().catch(()=>({}));message.textContent=response.ok?`Payment submitted for provider confirmation (${esc(result.status)}).`: 'Payment could not be submitted.';button.disabled=false});load();</script></body></html>
<script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;const response=await fetch('/api/public/invoice?token='+encodeURIComponent(token));if(!response.ok)return;const invoice=await response.json();if(!invoice.payments?.length)return;const target=document.querySelector('#schedule');target.hidden=false;target.querySelector('h2').textContent='Payment history';target.querySelector('#schedule-items').innerHTML=invoice.payments.map(payment=>`<div class="schedule-row"><span>${esc(payment.method)}<br><small>${esc(payment.reference)} · ${payment.paidAt?new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(new Date(payment.paidAt)):''}</small></span><strong>$${Number(payment.amount).toFixed(2)} settled</strong></div>`).join('')},700);</script>
<script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;const response=await fetch('/api/public/invoice?token='+encodeURIComponent(token));if(!response.ok)return;const invoice=await response.json();if(!invoice.lineItems?.length)return;const target=document.querySelector('#details');if(!target)return;const section=document.createElement('div');section.style='margin-top:18px;text-align:left;border-top:1px solid #e1e9e6;padding-top:14px';const heading=document.createElement('strong');heading.textContent='Invoice details';section.append(heading);invoice.lineItems.forEach((item)=>{const row=document.createElement('div');row.style='display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px';const label=document.createElement('span');label.textContent=`${item.description} · ${item.quantity} × $${Number(item.unitPrice).toFixed(2)}`;const amount=document.createElement('strong');amount.textContent='$'+Number(item.amount).toFixed(2);row.append(label,amount);section.append(row)});target.after(section)},950);</script>
