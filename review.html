<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Northstar Review</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f4f8f7}body{margin:0;padding:24px}.card{max-width:470px;margin:8vh auto;background:#fff;border:1px solid #dfe8e6;border-radius:18px;padding:26px;box-shadow:0 18px 45px #18304414}.eyebrow{color:#2c9d73;font-size:11px;font-weight:800;letter-spacing:1.5px}h1{font-size:26px;margin:10px 0 4px}.sub{color:#75858c;font-size:13px;margin-bottom:20px}label{display:block;font-weight:800;font-size:13px;margin-top:16px}select,textarea,button{box-sizing:border-box;width:100%;margin-top:8px;border:1px solid #d7e3df;border-radius:10px;padding:13px;font:inherit}textarea{min-height:110px}button{border:0;background:#2c9d73;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#message{color:#728189;font-size:13px;margin-top:16px}</style></head><body><main class="card"><div class="eyebrow">NORTHSTAR SERVICE FEEDBACK</div><h1 id="service">Loading…</h1><div class="sub" id="customer"></div><form id="form"><label for="rating">How was your service?</label><select id="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Needs improvement</option><option value="1">1 — Poor</option></select><label for="comment">Anything we should know? (optional)</label><textarea id="comment" maxlength="500" placeholder="Tell us about your experience."></textarea><button id="submit">Submit review</button></form><div id="message"></div></main><script>const token=new URLSearchParams(location.search).get('token'),query='?token='+encodeURIComponent(token||''),message=document.querySelector('#message');async function load(){const r=await fetch('/api/public/review'+query);if(!r.ok){message.textContent='This review link is invalid, expired, or not ready.';document.querySelector('#form').remove();return}const x=await r.json();document.querySelector('#service').textContent=x.service;document.querySelector('#customer').textContent=`Thanks, ${x.customer}.`;if(x.submitted){message.textContent=`Your ${x.rating}/5 review has already been received.`;document.querySelector('#form').remove()}}document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const b=document.querySelector('#submit');b.disabled=true;const r=await fetch('/api/public/review'+query,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rating:Number(document.querySelector('#rating').value),comment:document.querySelector('#comment').value})});if(r.ok){document.querySelector('#form').remove();message.textContent='Thank you. Your review has been added to the service record.'}else{b.disabled=false;message.textContent='This review could not be submitted.'}};load();</script></body></html>
