<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Northstar Customer Portal</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f4f8f7}body{margin:0;padding:22px}.card{max-width:620px;margin:4vh auto;background:#fff;border:1px solid #dfe8e6;border-radius:18px;padding:24px;box-shadow:0 18px 45px #18304414}h1{font-size:26px;margin:8px 0 4px}.eyebrow{color:#2c9d73;font-size:11px;font-weight:800;letter-spacing:1.5px}.intro{color:#72828b;font-size:13px}.section{margin-top:25px}.section h2{font-size:15px;border-bottom:1px solid #e8efed;padding-bottom:9px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eef3f1;font-size:13px}.row small{display:block;color:#788890;margin-top:4px}.pill{color:#25835e;font-weight:800;font-size:11px;white-space:nowrap}#message{color:#71818a;font-size:13px;margin-top:18px}</style></head>
<body><main class="card"><div class="eyebrow">NORTHSTAR CUSTOMER PORTAL</div><h1 id="name">Loading…</h1><div class="intro" id="location"></div><div id="content"></div><div id="message"></div></main><script>
const token=new URLSearchParams(location.search).get('token');const api='/api/public/customer-portal?token='+encodeURIComponent(token||'');const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const section=(title,items,main,sub,status)=>items.length?`<section class="section"><h2>${title}</h2>${items.map(x=>`<div class="row"><div>${esc(main(x))}<small>${esc(sub(x))}</small></div><span class="pill">${esc(status(x))}</span></div>`).join('')}</section>`:'';const estimateSection=(items)=>items.length?`<section class="section"><h2>Estimates</h2>${items.map(x=>`<div class="row"><div>${esc(x.service)}<small>${esc(x.value)}</small>${x.estimateApprovalToken?`<button class="secondary approve" data-token="${esc(x.estimateApprovalToken)}">Approve estimate</button>`:''}</div><span class="pill">${esc(x.status)}</span></div>`).join('')}</section>`:'';async function load(){if(!token){document.querySelector('#message').textContent='This portal link is missing.';return}const r=await fetch(api);if(!r.ok){document.querySelector('#message').textContent='This portal link is invalid or expired.';return}const p=await r.json();document.querySelector('#name').textContent=p.customer.name;document.querySelector('#location').textContent=p.customer.location;document.querySelector('#content').innerHTML=section('Service locations',p.locations,x=>x.label,x=>x.address,x=> 'Verified')+section('Appointments',p.jobs,x=>x.service,x=>`${x.time} · ${x.technician||'Technician pending'}`,x=>x.status)+section('Equipment',p.assets,x=>x.name,x=>`Serial ${x.serial} · Installed ${x.installed}`,x=>x.status)+estimateSection(p.estimates)+section('Invoices',p.invoices,x=>x.value,x=>`Due ${x.due||'on receipt'} · Balance ${x.balance===null?'pending':'$'+x.balance}`,x=>x.status)+section('Service plans',p.plans,x=>x.service,x=>`${x.value} · Renewal ${x.renewal}`,x=>x.status);if(!document.querySelector('#content').innerHTML)document.querySelector('#message').textContent='No portal records are available yet.';document.querySelectorAll('.approve').forEach(button=>button.onclick=async()=>{button.disabled=true;const response=await fetch('/api/public/estimate/approve?token='+encodeURIComponent(button.dataset.token),{method:'POST'});if(response.ok){button.remove();document.querySelector('#message').textContent='Estimate approved. Your service provider will follow up with next steps.';load()}else{button.disabled=false;document.querySelector('#message').textContent='This estimate can no longer be approved.'}})}load();
</script></body></html>
