<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Northstar Customer Portal</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f4f8f7}body{margin:0;padding:22px}.card{max-width:680px;margin:4vh auto;background:#fff;border:1px solid #dfe8e6;border-radius:18px;padding:24px;box-shadow:0 18px 45px #18304414}h1{font-size:26px;margin:8px 0 4px}.eyebrow{color:#2c9d73;font-size:11px;font-weight:800;letter-spacing:1.5px}.intro{color:#72828b;font-size:13px}.section{margin-top:25px}.section h2{font-size:15px;border-bottom:1px solid #e8efed;padding-bottom:9px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eef3f1;font-size:13px}.row>div{min-width:0}.row small{display:block;color:#788890;margin-top:4px}.pill{color:#25835e;font-weight:800;font-size:11px;white-space:nowrap}button,select{border:0;border-radius:8px;padding:8px 10px;background:#eaf2ef;color:#237b5b;font:inherit;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button:disabled{opacity:.5;cursor:wait}.actions{margin-top:8px}.detail{margin-top:8px;padding:9px;background:#f4f8fb;border-radius:8px;font-size:12px}.detail-line{display:flex;justify-content:space-between;gap:10px;padding-top:5px}.link{display:inline-block;margin-top:8px;color:#237b5b;font-weight:700;text-decoration:none}#message{color:#71818a;font-size:13px;margin-top:18px;min-height:18px}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">NORTHSTAR CUSTOMER PORTAL</div>
<h1 id="name">Loading…</h1>
<div class="intro" id="location"></div>
<div id="content"></div>
<div class="actions" id="global-actions"><button data-action="book">Book another service</button><button data-action="referral">Refer a friend</button><button data-action="request" data-type="Question">Ask a question</button><button data-action="request" data-type="Cancellation request">Request cancellation</button><button data-action="request" data-type="Reschedule request">Request a reschedule</button><button data-action="preferences">Manage messaging preferences</button></div>
<div id="message" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('token');
  const query = token ? `?token=${encodeURIComponent(token)}` : '';
  const api = '/api/public/customer-portal' + query;
  const $ = (selector, root = document) => root.querySelector(selector);
  const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character]));
  const message = (value) => { $('#message').textContent = value; };
  const retryKey = (scope, body) => { const storageKey = `northstar-portal-retry-${token}-${scope}-${JSON.stringify(body)}`; const stored = sessionStorage.getItem(storageKey); if (stored) return stored; const next = crypto.randomUUID(); sessionStorage.setItem(storageKey, next); return next; };
  const post = async (path, body, key = retryKey(path, body)) => fetch(path + query, { method:'POST', headers:{ 'content-type':'application/json', 'idempotency-key':key }, body:JSON.stringify(body) });
  const postToken = async (path, value, body, key = retryKey(path, body)) => fetch(`${path}?token=${encodeURIComponent(value)}`, { method:'POST', headers:{ 'content-type':'application/json', 'idempotency-key':key }, body:JSON.stringify(body) });
  const section = (title, items, render) => items?.length ? `<section class="section"><h2>${esc(title)}</h2>${items.map(render).join('')}</section>` : '';
  const row = (main, sub, status, extra = '') => `<div class="row"><div>${main}<small>${sub}</small>${extra}</div><span class="pill">${status}</span></div>`;
  const details = (title, items, render) => items?.length ? `<div class="detail"><strong>${esc(title)}</strong>${items.map(render).join('')}</div>` : '';
  const load = async () => {
    if (!token) { message('This portal link is missing.'); return; }
    const response = await fetch(api);
    if (!response.ok) { message('This portal link is invalid or expired.'); return; }
    const portal = await response.json();
    window.__northstarPortal = portal;
    $('#name').textContent = portal.customer.name;
    $('#location').innerHTML = `${esc(portal.customer.location)} <button data-action="primary-location">Update service address</button> <button data-action="additional-location">Add service location</button>`;
    $('#content').innerHTML = section('Service locations', portal.locations, (item) => row(esc(item.label), esc(item.address), 'Verified', `<a class="link map-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address)}">Open in maps</a>`))
      + section('Appointments', portal.jobs, (job) => { const terminal = ['Completed','Canceled'].includes(job.status); const controls = terminal ? '' : `<button data-action="confirm" data-job-id="${esc(job.id)}">${job.confirmationStatus === 'Confirmed' ? 'Confirmed' : 'Confirm appointment'}</button><select aria-label="Choose a new appointment time" data-slot-for="${esc(job.id)}"><option value="">Choose a new time</option>${(job.availableRescheduleSlots || []).map((slot) => `<option value="${esc(slot.id)}">${esc(slot.label)}</option>`).join('')}</select><button data-action="reschedule" data-job-id="${esc(job.id)}">${job.status === 'No-show' ? 'Book a new visit' : 'Reschedule'}</button><button data-action="cancel" data-job-id="${esc(job.id)}">Cancel appointment</button><button data-action="job-request" data-job-id="${esc(job.id)}">Ask about this visit</button>${job.startsAt && job.endsAt ? `<a class="link" target="_blank" rel="noopener" href="/api/public/customer-portal/calendar${window.location.search}&jobId=${encodeURIComponent(job.id)}">Add to calendar</a>` : ''}`; const evidence = `${job.completionNote ? `<div class="detail"><strong>Technician note</strong><div>${esc(job.completionNote)}</div></div>` : ''}${job.reviewUrl ? `<a class="link" target="_blank" rel="noopener" href="${esc(job.reviewUrl)}">Leave a review <small>(link expires in ${esc(job.reviewLinkExpiresInHours || 72)} hours)</small></a>` : ''}${job.photos?.length ? details('Photo evidence', job.photos, (photo) => `<div class="detail-line"><a class="link" target="_blank" rel="noopener" href="${esc(photo.url)}">${esc(photo.caption || 'Photo')}</a><span>${esc(photo.capturedAt || '')}</span></div>`) : ''}${job.visits?.length ? details('Visits', job.visits, (visit) => `<div class="detail-line"><span>${visit.sequence}. ${esc(visit.time)}${visit.technician ? ` · ${esc(visit.technician)}` : ''}</span><span>${esc(visit.status)}</span></div>`) : ''}`; const eta = job.estimatedArrivalMinutes ? ` · ETA ${esc(job.estimatedArrivalMinutes)} minutes` : ''; return row(esc(job.service), `${esc(job.time)} · ${esc(job.technician || 'Technician pending')}${eta}${job.tracking?.status === 'live' ? ' · Tracking live' + (job.tracking.updatedAt ? ' · Updated ' + new Date(job.tracking.updatedAt).toLocaleTimeString() : '') : ''}`, esc(job.status), `<div class="actions">${controls}</div>${evidence}`); })
      + section('Equipment', portal.assets, (item) => row(esc(item.name), `Serial ${esc(item.serial)} · Installed ${esc(item.installed)}${item.warrantyThrough ? ` · Warranty through ${esc(item.warrantyThrough)}` : ''}${item.nextServiceDue ? ` · Service due ${esc(item.nextServiceDue)} (${esc(item.serviceDueStatus || 'Scheduled')})` : ''}${item.serviceHistory?.length ? ` · ${item.serviceHistory.map((job) => `${job.service} (${job.status})`).join('; ')}` : ''}`, esc(item.status)))
      + section('Estimates', portal.estimates, (estimate) => { const actionable = estimate.estimateApprovalToken ? `<a class="link" target="_blank" rel="noopener" href="${esc(estimate.estimateUrl || '')}">Open detailed estimate</a><a class="link" target="_blank" rel="noopener" href="/api/public/customer-portal/estimate/pdf?token=${encodeURIComponent(token)}&estimateId=${encodeURIComponent(estimate.id)}">Download PDF</a><button data-action="approve" data-token="${esc(estimate.estimateApprovalToken)}">Approve estimate</button><button data-action="decline" data-token="${esc(estimate.estimateApprovalToken)}">Decline estimate</button><button data-action="request-change" data-token="${esc(estimate.estimateApprovalToken)}">Request changes</button><button data-action="finance-estimate" data-estimate-id="${esc(estimate.id)}">Request financing</button>` : ''; const options = estimate.options?.length ? details('Options', estimate.options, (option) => `<label class="detail-line"><span><input type="radio" data-estimate-option data-amount="${Number(option.amount)}" name="option-${esc(estimate.service)}" value="${esc(option.id)}" /> ${esc(option.label)}</span><span>$${Number(option.amount).toFixed(2)}</span></label>`) : ''; return row(esc(estimate.changeOrder ? `Change order: ${estimate.service}` : estimate.service), esc(estimate.changeOrderNote || estimate.value), esc(estimate.status), `<div class="actions">${options}${actionable}</div>`); })
      + section('Invoices', portal.invoices, (invoice) => row(esc(invoice.value), `Due ${esc(invoice.due || 'on receipt')} · Balance ${invoice.balance === null ? 'pending' : '$' + esc(invoice.balance)}`, esc(invoice.status), `<div class="actions">${invoice.status !== 'Paid' ? `<button data-action="pay" data-invoice-id="${esc(invoice.id)}">Start payment</button><button data-action="finance" data-invoice-id="${esc(invoice.id)}">Request financing</button>` : ''}${invoice.paymentUrl ? `<a class="link" target="_blank" rel="noopener" href="${esc(invoice.paymentUrl)}">Open secure payment page</a>` : ''}</div>${invoice.lineItems?.length ? details('Invoice details', invoice.lineItems, (item) => `<div class="detail-line"><span>${esc(item.description)} · ${Number(item.quantity)} × $${Number(item.unitPrice).toFixed(2)}</span><strong>$${Number(item.amount).toFixed(2)}</strong></div>`) : ''}${invoice.subtotal !== undefined ? `<div class="detail"><div class="detail-line"><span>Subtotal</span><strong>$${Number(invoice.subtotal).toFixed(2)}</strong></div>${Number(invoice.discount || 0) ? `<div class="detail-line"><span>Discount</span><strong>−$${Number(invoice.discount).toFixed(2)}</strong></div>` : ''}<div class="detail-line"><span>Tax</span><strong>$${Number(invoice.tax || 0).toFixed(2)}</strong></div></div>` : ''}${details('Payment history', invoice.payments, (payment) => `<div class="detail-line"><span>${esc(payment.method)} · ${esc(payment.reference)}</span><span>$${Number(payment.amount).toFixed(2)}</span></div>`)}${details('Payment attempts', invoice.paymentAttempts, (attempt) => `<div class="detail-line"><span>${esc(attempt.method)} · ${esc(attempt.status)}${attempt.installmentId ? ` · installment ${esc(attempt.installmentId)}` : ''}</span><span>$${Number(attempt.amount).toFixed(2)}</span></div>`)}${details('Payment plan', invoice.schedule, (item) => `<div class="detail-line"><span>Payment ${item.sequence} · ${esc(item.due)}</span><span>$${Number(item.amount).toFixed(2)} · ${esc(item.status)}</span></div>`)}`))
      + section('Financing requests', portal.financingApplications, (application) => row(`$${Number(application.amount).toFixed(2)} · ${esc(application.termMonths)} months`, `${application.invoiceId ? `Invoice ${esc(application.invoiceId)}` : `Estimate ${esc(application.estimateId)}`} · ${esc(application.provider)}`, esc(application.status)))
      + section('Service plans', portal.plans, (plan) => row(esc(plan.service), `${esc(plan.value)} · Renewal ${esc(plan.renewal)}${plan.assetName ? ` · Equipment ${esc(plan.assetName)}` : ''}${plan.nextVisit?.time ? ` · Next visit ${esc(plan.nextVisit.time)}` : ''}`, esc(plan.status)))
      + section('Messages', portal.messages, (item) => row(esc(item.channel || 'Message'), esc(item.message), esc(item.status || item.direction || '')))
      + section('Requests', portal.requests, (item) => row(esc(item.type), esc(item.message), esc(item.status || 'Open')));
  };
    document.querySelectorAll('input[data-estimate-option]').forEach((input) => input.addEventListener('change', () => { const value = input.closest('.row')?.querySelector('small'); if (value) value.textContent = '$' + Number(input.dataset.amount).toFixed(2); }));
  document.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-action]'); if (!button) return;
    const action = button.dataset.action; button.disabled = true;
    try {
      if (action === 'book') { const portal = window.__northstarPortal || {}; const catalog = portal.catalog || []; const catalogChoice = prompt(catalog.length ? 'Choose a service number, or type 0 for a custom service:\n' + catalog.map((item, index) => `${index + 1}. ${item.name} · ${item.durationMinutes || 60} min`).join('\n') : 'No pricebook services are configured. Type a custom service name.', catalog.length ? '1' : ''); if (catalog.length && catalogChoice === null) return; const selectedCatalog = catalog[Number(catalogChoice) - 1]; const service = selectedCatalog ? selectedCatalog.name : prompt('What service would you like to book?', ''); if (!service?.trim()) return; const intakeAnswers = {}; for (const field of (portal.intakeFields || [])) { const suffix = field.type === 'select' && field.options?.length ? `\nOptions: ${field.options.join(', ')}` : field.type === 'checkbox' ? '\nType yes or no.' : ''; const answer = prompt(`${field.label}${field.required ? ' (required)' : ''}${suffix}`, field.type === 'checkbox' ? 'no' : ''); if (answer === null) return; const normalized = field.type === 'checkbox' ? ['yes', 'true', '1'].includes(answer.trim().toLowerCase()) : answer.trim(); if (field.required && !String(normalized).trim()) { message(`${field.label} is required.`); return; } if (field.options?.length && normalized && !field.options.includes(normalized)) { message(`Choose one of the listed options for ${field.label}.`); return; } if (String(normalized).trim()) intakeAnswers[field.id] = normalized; } const slotResponse = selectedCatalog ? await fetch('/api/public/customer-portal/availability' + query + '&catalogItemId=' + encodeURIComponent(selectedCatalog.id)) : null; const slotBody = slotResponse ? await slotResponse.json().catch(() => ({})) : {}; const slots = slotBody.slotOptions || portal.availableBookingSlots || []; if (!slots.length) { message('No online appointment times are available right now.'); return; } const choice = prompt('Choose an appointment number:\n' + slots.map((slot, index) => `${index + 1}. ${slot.label}`).join('\n'), '1'); const slot = slots[Number(choice) - 1]; if (!slot) { message('Choose a valid appointment time.'); return; } const result = await post('/api/public/customer-portal/book', { service: service.trim(), ...(selectedCatalog ? { catalogItemId: selectedCatalog.id } : {}), slotId: slot.id, ...(Object.keys(intakeAnswers).length ? { intakeAnswers } : {}) }); message(result.ok ? 'New service booked. Your provider will confirm the appointment.' : 'New service could not be booked.'); if (result.ok) await load(); } else if (action === 'request') { const promptText = button.dataset.type === 'Question' ? 'What would you like to ask?' : button.dataset.type === 'Cancellation request' ? 'Why do you need to cancel?' : 'What time would work better?'; const text = prompt(promptText); if (!text?.trim()) return; const priority = prompt('Priority: Low, Normal, High, or Urgent', 'Normal'); if (!['Low', 'Normal', 'High', 'Urgent'].includes(priority)) return; const result = await post('/api/public/customer-portal/request', { type:button.dataset.type, priority, message:text.trim() }); message(result.ok ? 'Request sent. Your provider will follow up shortly.' : 'Request could not be sent.'); } else if (action === 'job-request') { const text = prompt('What would you like to ask about this visit?'); if (!text?.trim()) return; const priority = prompt('Priority: Low, Normal, High, or Urgent', 'Normal'); if (!['Low', 'Normal', 'High', 'Urgent'].includes(priority)) return; const result = await post('/api/public/customer-portal/request', { type:'Question', jobId:button.dataset.jobId, priority, message:text.trim() }); message(result.ok ? 'Question sent for this appointment.' : 'Question could not be sent.'); }
      else if (action === 'confirm') { const result = await post('/api/public/customer-portal/confirm', { jobId:button.dataset.jobId }); message(result.ok ? 'Appointment confirmed.' : 'Appointment could not be confirmed.'); if (result.ok) await load(); }
      else if (action === 'reschedule') { const slot = $(`[data-slot-for="${CSS.escape(button.dataset.jobId)}"]`)?.value; if (!slot) { message('Choose a new appointment time first.'); return; } const result = await post('/api/public/customer-portal/reschedule', { jobId:button.dataset.jobId, slotId:slot }); message(result.ok ? 'Appointment rescheduled.' : 'That time is no longer available.'); if (result.ok) await load(); }
      else if (action === 'cancel') { const reason = prompt('Why do you need to cancel?'); if (!reason?.trim() || !confirm('Cancel this appointment now?')) return; const result = await post('/api/public/customer-portal/cancel', { jobId:button.dataset.jobId, reason:reason.trim() }); message(result.ok ? 'Appointment canceled.' : 'Appointment could not be canceled.'); if (result.ok) await load(); }
      else if (['approve', 'decline', 'request-change'].includes(action)) { const selected = button.closest('.row')?.querySelector('input[type="radio"]:checked')?.value; const approverName = action === 'approve' ? (prompt('Your name for approval') || '').trim() : ''; if (action === 'approve' && approverName.length < 2) return; const body = action === 'approve' ? (selected ? { optionId:selected, approverName } : { approverName }) : { reason:(prompt(action === 'request-change' ? 'What would you like changed?' : 'Why are you declining this estimate?') || '').trim() }; if (['decline', 'request-change'].includes(action) && body.reason.length < 3) return; const result = await postToken(`/api/public/estimate/${action}`, button.dataset.token, body); message(result.ok ? `Estimate ${action === 'request-change' ? 'change requested' : `${action}d`}.` : `This estimate can no longer be updated.`); if (result.ok) await load(); }
      else if (action === 'pay') { const invoice = (window.__northstarPortal?.invoices || []).find((item) => item.id === button.dataset.invoiceId); const schedule = (invoice?.schedule || []).filter((item) => item.status !== 'Paid'); const choice = schedule.length ? prompt('Payment plan installment number (blank for remaining balance):\\n' + schedule.map((item) => item.sequence + '. ' + item.due + ' · $' + (Number(item.amount) - Number(item.paidAmount || 0)).toFixed(2)).join('\\n'), '') : ''; const installment = schedule.find((item) => String(item.sequence) === String(choice || '').trim()); if (schedule.length && String(choice || '').trim() && !installment) { message('Choose a valid unpaid installment number.'); return; } const amount = Number(prompt('Payment amount', installment ? (Number(installment.amount) - Number(installment.paidAmount || 0)).toFixed(2) : Number(invoice?.balance || 0).toFixed(2))); const method = prompt('Payment method: Card or ACH', 'Card'); if (!amount || !['Card','ACH'].includes(method)) return; const result = await post('/api/public/customer-portal/payment-intent', { invoiceId:button.dataset.invoiceId, amount, method, ...(installment ? { installmentId:installment.id } : {}) }); message(result.ok ? 'Payment submitted for provider confirmation.' : 'Payment could not be submitted.'); if (result.ok) await load(); }
      else if (action === 'finance') { const invoice = (window.__northstarPortal?.invoices || []).find((item) => item.id === button.dataset.invoiceId); const amount = Number(prompt('Amount to finance', Number(invoice?.balance || 0).toFixed(2))); const termMonths = Number(prompt('Term in months: 6, 12, 18, 24, 36, 48, or 60', '12')); const provider = prompt('Preferred financing provider (optional)', 'Provider pending') || 'Provider pending'; if (!amount || ![6,12,18,24,36,48,60].includes(termMonths)) return; const result = await post('/api/public/customer-portal/financing-intent', { invoiceId:button.dataset.invoiceId, amount, termMonths, provider }); message(result.ok ? 'Financing request sent. A provider decision is still pending.' : 'Financing request could not be sent.'); if (result.ok) await load(); }
      else if (action === 'finance-estimate') { const estimate = (window.__northstarPortal?.estimates || []).find((item) => item.id === button.dataset.estimateId); const amount = Number(prompt('Amount to finance', Number(String(estimate?.value || '').replace(/[^\\d.-]/g, '')).toFixed(2))); const termMonths = Number(prompt('Term in months: 6, 12, 18, 24, 36, 48, or 60', '12')); const provider = prompt('Preferred financing provider (optional)', 'Provider pending') || 'Provider pending'; if (!amount || ![6,12,18,24,36,48,60].includes(termMonths)) return; const result = await post('/api/public/customer-portal/financing-intent', { estimateId:button.dataset.estimateId, amount, termMonths, provider }); message(result.ok ? 'Financing request sent. A provider decision is still pending.' : 'Financing request could not be sent.'); if (result.ok) await load(); }
      else if (action === 'primary-location' || action === 'additional-location') { const address = prompt(action === 'primary-location' ? 'Primary service address' : 'Additional service address'); if (!address?.trim()) return; const body = { mode:action === 'primary-location' ? 'primary' : 'additional', address:address.trim() }; if (body.mode === 'additional') body.label = prompt('Location label', 'Secondary property') || 'Service address'; const result = await post('/api/public/customer-portal/location', body); message(result.ok ? 'Service location updated.' : 'Service location could not be updated.'); if (result.ok) await load(); }
      else if (action === 'preferences') { const current = await fetch('/api/public/customer-portal/preferences' + query).then((result) => result.ok ? result.json() : {}).catch(() => ({})); const sms = prompt('SMS preference: type opt-out or allow', current.contactPreferences?.smsOptOut ? 'opt-out' : 'allow'); const email = prompt('Email preference: type opt-out or allow', current.contactPreferences?.emailOptOut ? 'opt-out' : 'allow'); if (!['opt-out','allow'].includes(sms) || !['opt-out','allow'].includes(email)) return; const result = await post('/api/public/customer-portal/preferences', { smsOptOut:sms === 'opt-out', emailOptOut:email === 'opt-out' }); message(result.ok ? 'Messaging preferences updated.' : 'Preferences could not be updated.'); }
    } catch { message('That action could not be completed. Please try again.'); } finally { button.disabled = false; }
  });
  let portalRefreshBusy = false;
  const portalRefreshTimer = setInterval(async () => { if (document.hidden || portalRefreshBusy) return; portalRefreshBusy = true; try { const response = await fetch('/api/public/customer-portal' + query); if (!response.ok) return; const next = await response.json(); if ((next.jobs || []).some((job) => ['En route', 'In progress'].includes(job.status) && !['Completed', 'Canceled'].includes(job.status))) await load(); } catch {} finally { portalRefreshBusy = false; } }, 30000);
  window.addEventListener('beforeunload', () => clearInterval(portalRefreshTimer));
  load();
})();
</script>
<script>
(() => {
  let selectedLocationId = '';
  const originalFetch = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    const url = typeof input === 'string' ? input : input?.url || '';
    if (selectedLocationId && url.includes('/api/public/customer-portal/book') && init.body) {
      try { const body = JSON.parse(init.body); body.locationId = selectedLocationId; init = { ...init, body: JSON.stringify(body) }; } catch {}
    }
    return originalFetch(input, init);
  };
  document.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action="book"]');
    if (!button) return;
    const locations = window.__northstarPortal?.locations || [];
    if (!locations.length) return;
    const choice = window.prompt('Choose a service location:\n' + locations.map((item, index) => `${index + 1}. ${item.label} · ${item.address}`).join('\n'), '1');
    if (choice === null) { event.preventDefault(); event.stopImmediatePropagation(); return; }
    const location = locations[Number(choice) - 1];
    if (!location) { event.preventDefault(); event.stopImmediatePropagation(); return; }
    selectedLocationId = location.id;
  }, true);
})();
</script>
<script>
(() => {
  const token = new URLSearchParams(location.search).get('token');
  if (!token) return;
  const query = `?token=${encodeURIComponent(token)}`;
  const message = (value) => { const target = document.querySelector('#message'); if (target) target.textContent = value; };
  const dialog = document.createElement('dialog');
  dialog.setAttribute('aria-labelledby', 'preferences-title');
  dialog.innerHTML = '<form method="dialog" style="min-width:min(420px,78vw);padding:8px"><h2 id="preferences-title">Messaging preferences</h2><p>Choose which appointment and service messages you would like to receive.</p><label style="display:block;margin:14px 0"><input name="sms" type="checkbox"> SMS updates</label><label style="display:block;margin:14px 0"><input name="email" type="checkbox"> Email updates</label><div style="display:flex;gap:8px;justify-content:flex-end"><button value="cancel">Cancel</button><button id="save-preferences" value="default">Save preferences</button></div><p id="preferences-error" role="alert" style="color:#a34b35"></p></form>';
  document.body.append(dialog);
  const form = dialog.querySelector('form');
  const open = async (event) => {
    const button = event.target.closest('[data-action="preferences"]');
    if (!button) return;
    event.preventDefault(); event.stopImmediatePropagation();
    const current = await fetch('/api/public/customer-portal/preferences' + query).then((result) => result.ok ? result.json() : {}).catch(() => ({}));
    form.elements.sms.checked = !current.contactPreferences?.smsOptOut;
    form.elements.email.checked = !current.contactPreferences?.emailOptOut;
    form.querySelector('#preferences-error').textContent = '';
    dialog.showModal();
  };
  document.addEventListener('click', open, true);
  form.addEventListener('submit', async (event) => {
    if (event.submitter?.value !== 'default') return;
    event.preventDefault();
    const save = form.querySelector('#save-preferences'); save.disabled = true;
    try {
      const response = await fetch('/api/public/customer-portal/preferences' + query, { method: 'POST', headers: { 'content-type': 'application/json', 'idempotency-key': crypto.randomUUID() }, body: JSON.stringify({ smsOptOut: !form.elements.sms.checked, emailOptOut: !form.elements.email.checked }) });
      if (!response.ok) throw new Error('save_failed');
      dialog.close(); message('Messaging preferences updated.');
    } catch { form.querySelector('#preferences-error').textContent = 'Preferences could not be updated. Please try again.'; } finally { save.disabled = false; }
  });
})();
</script>

<script>(()=>{const add=()=>{const portal=window.__northstarPortal;if(!portal?.invoices?.length)return;const section=[...document.querySelectorAll('.section')].find((node)=>node.querySelector('h2')?.textContent==='Invoices');if(!section)return;section.querySelectorAll('.row').forEach((row,index)=>{const invoice=portal.invoices[index];if(!invoice?.invoicePdfUrl||row.querySelector('[data-invoice-pdf]'))return;const link=document.createElement('a');link.className='link';link.dataset.invoicePdf='true';link.target='_blank';link.rel='noopener';link.href=invoice.invoicePdfUrl;link.textContent='Download invoice PDF';row.querySelector('.actions')?.append(link)});};const timer=setInterval(()=>{add();if(window.__northstarPortal?.invoices)clearInterval(timer)},150);})();</script>
