<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Northstar Customer Portal</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f4f8f7}body{margin:0;padding:22px}.card{max-width:620px;margin:4vh auto;background:#fff;border:1px solid #dfe8e6;border-radius:18px;padding:24px;box-shadow:0 18px 45px #18304414}h1{font-size:26px;margin:8px 0 4px}.eyebrow{color:#2c9d73;font-size:11px;font-weight:800;letter-spacing:1.5px}.intro{color:#72828b;font-size:13px}.section{margin-top:25px}.section h2{font-size:15px;border-bottom:1px solid #e8efed;padding-bottom:9px}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #eef3f1;font-size:13px}.row small{display:block;color:#788890;margin-top:4px}.pill{color:#25835e;font-weight:800;font-size:11px;white-space:nowrap}button{border:0;border-radius:8px;padding:8px 10px;background:#eaf2ef;color:#237b5b;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}button:disabled{opacity:.5}#message{color:#71818a;font-size:13px;margin-top:18px}</style></head>
<body><main class="card"><div class="eyebrow">NORTHSTAR CUSTOMER PORTAL</div><h1 id="name">Loading…</h1><div class="intro" id="location"></div><div id="content"></div><div style="display:flex;gap:8px;margin-top:22px;flex-wrap:wrap"><button class="request" data-type="Reschedule request">Request a reschedule</button><button class="request" data-type="Cancellation request">Request cancellation</button><button class="request" data-type="Question">Ask a question</button></div><div id="message"></div></main><script>
const token=new URLSearchParams(location.search).get('token');const query=token?'?token='+encodeURIComponent(token):'';const api='/api/public/customer-portal'+query;const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const section=(title,items,main,sub,status)=>items.length?`<section class="section"><h2>${title}</h2>${items.map(x=>`<div class="row"><div>${esc(main(x))}<small>${esc(sub(x))}</small></div><span class="pill">${esc(status(x))}</span></div>`).join('')}</section>`:'';const estimateSection=(items)=>items.length?`<section class="section"><h2>Estimates</h2>${items.map(x=>`<div class="row"><div>${esc(x.service)}<small>${esc(x.value)}</small>${x.options?.length?`<div style="margin-top:8px">${x.options.map((option,index)=>`<label style="display:block;padding:5px 0"><input class="estimate-option" name="option-${esc(x.service)}" value="${esc(option.id)}" type="radio" ${index===0?'checked':''}/> ${esc(option.label)} · $${esc(option.amount)}<small style="margin-left:22px">${esc(option.description)}</small></label>`).join('')}</div>`:''}${x.estimateApprovalToken?`<button class="approve" data-token="${esc(x.estimateApprovalToken)}">Approve estimate</button>`:''}</div><span class="pill">${esc(x.status)}</span></div>`).join('')}</section>`:'';const invoiceSection=(items)=>items.length?`<section class="section"><h2>Invoices</h2>${items.map((x,index)=>`<div class="row"><div>${esc(x.value)}<small>Due ${esc(x.due||'on receipt')} · Balance ${x.balance===null?'pending':'$'+esc(x.balance)}</small>${x.status!=='Paid'?`<button class="pay" data-index="${index}">Start payment</button>`:''}</div><span class="pill">${esc(x.status)}</span></div>`).join('')}</section>`:'';async function load(){if(!token){message.textContent='This portal link is missing.';return}const r=await fetch(api);if(!r.ok){message.textContent='This portal link is invalid or expired.';return}const p=await r.json();document.querySelector('#name').textContent=p.customer.name;document.querySelector('#location').textContent=p.customer.location;document.querySelector('#content').innerHTML=section('Service locations',p.locations,x=>x.label,x=>x.address,x=>'Verified')+section('Appointments',p.jobs,x=>x.service,x=>`${x.time} · ${x.technician||'Technician pending'}`,x=>x.status)+section('Equipment',p.assets,x=>x.name,x=>`Serial ${x.serial} · Installed ${x.installed}`,x=>x.status)+estimateSection(p.estimates)+invoiceSection(p.invoices)+section('Service plans',p.plans,x=>x.service,x=>`${x.value} · Renewal ${x.renewal}`,x=>x.status);document.querySelectorAll('.approve').forEach(button=>button.onclick=async()=>{button.disabled=true;const selected=button.closest('.row')?.querySelector('.estimate-option:checked')?.value;const response=await fetch('/api/public/estimate/approve?token='+encodeURIComponent(button.dataset.token),{method:'POST',headers:{'content-type':'application/json'},body:selected?JSON.stringify({optionId:selected}):'{}'});message.textContent=response.ok?'Estimate approved.':'This estimate can no longer be approved.';if(response.ok)load();else button.disabled=false});document.querySelectorAll('.pay').forEach(button=>button.onclick=async()=>{const invoice=p.invoices[Number(button.dataset.index)];const amount=prompt('Payment amount',String(invoice.balance));const method=prompt('Payment method: Card or ACH','Card');if(!amount||!['Card','ACH'].includes(method))return;button.disabled=true;const response=await fetch('/api/public/customer-portal/payment-intent'+query,{method:'POST',headers:{'content-type':'application/json','idempotency-key':crypto.randomUUID()},body:JSON.stringify({invoiceId:invoice.id,amount:Number(amount),method})});message.textContent=response.ok?'Payment submitted for provider confirmation.':'Payment could not be submitted.';button.disabled=false})}const message=(value)=>{document.querySelector('#message').textContent=value};document.querySelectorAll('.request').forEach(button=>button.onclick=async()=>{const text=prompt(button.dataset.type==='Question'?'What would you like to ask?':'What time would work better?');if(!text)return;button.disabled=true;const response=await fetch('/api/public/customer-portal/request'+query,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:button.dataset.type,message:text})});button.disabled=false;message(response.ok?'Request sent. Your provider will follow up shortly.':'Request could not be sent.')});load();
(async () => { const token = new URLSearchParams(location.search).get('token'); if (!token) return; const response = await fetch('/api/public/customer-portal?token=' + encodeURIComponent(token)); if (!response.ok) return; const portal = await response.json(); const section = [...document.querySelectorAll('.section')].find((node) => node.querySelector('h2')?.textContent === 'Appointments'); if (!section) return; section.querySelectorAll('.row').forEach((row, index) => { const job = portal.jobs[index]; if (!job || job.confirmationStatus === 'Confirmed') return; const button = document.createElement('button'); button.className = 'confirm'; button.textContent = 'Confirm appointment'; button.onclick = async () => { button.disabled = true; const result = await fetch('/api/public/customer-portal/confirm?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jobId: job.id }) }); if (result.ok) { row.querySelector('.pill').textContent = 'Confirmed'; button.remove(); document.querySelector('#message').textContent = 'Appointment confirmed.'; } else { button.disabled = false; document.querySelector('#message').textContent = 'Appointment could not be confirmed.'; } }; row.querySelector('div').append(button); }); })();

(async () => { const token = new URLSearchParams(location.search).get('token'); if (!token) return; const response = await fetch('/api/public/customer-portal?token=' + encodeURIComponent(token)); if (!response.ok) return; const portal = await response.json(); const appointmentSection = [...document.querySelectorAll('.section')].find((node) => node.querySelector('h2')?.textContent === 'Appointments'); if (!appointmentSection) return; appointmentSection.querySelectorAll('.row').forEach((row, index) => { const job = portal.jobs?.[index]; if (!job || row.querySelector('.appointment-request')) return; const actions = document.createElement('div'); actions.className = 'appointment-request'; actions.style = 'display:flex;gap:6px;flex-wrap:wrap'; for (const type of ['Reschedule request', 'Cancellation request']) { const button = document.createElement('button'); button.textContent = type === 'Reschedule request' ? 'Request change' : 'Request cancellation'; button.onclick = async () => { const promptText = type === 'Reschedule request' ? 'What time would work better?' : 'Why do you need to cancel?'; const detail = prompt(promptText); if (!detail) return; button.disabled = true; const result = await fetch('/api/public/customer-portal/request?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'content-type': 'application/json', 'idempotency-key': crypto.randomUUID() }, body: JSON.stringify({ type, jobId: job.id, message: detail }) }); button.disabled = false; document.querySelector('#message').textContent = result.ok ? 'Request sent for this appointment.' : 'Request could not be sent.'; }; actions.append(button); } row.querySelector('div')?.append(actions); }); })();

(async () => { const token = new URLSearchParams(location.search).get('token'); if (!token) return; const response = await fetch('/api/public/customer-portal?token=' + encodeURIComponent(token)); if (!response.ok) return; const portal = await response.json(); const section = [...document.querySelectorAll('.section')].find((node) => node.querySelector('h2')?.textContent === 'Appointments'); if (!section) return; section.querySelectorAll('.row').forEach((row, index) => { const visits = portal.jobs?.[index]?.visits || []; if (!visits.length) return; const details = document.createElement('small'); details.textContent = 'Visits: ' + visits.map((visit) => `${visit.sequence}. ${visit.time}${visit.technician ? ` · ${visit.technician}` : ''} (${visit.status})`).join(' | '); row.querySelector('div')?.append(details); }); })();

(() => { const originalFetch = window.fetch.bind(window); window.fetch = (input, init = {}) => { const url = String(typeof input === 'string' ? input : input?.url || ''); if (url.includes('/api/public/estimate/approve') && init.body) { try { const body = JSON.parse(init.body); if (!body.approverName) { const name = prompt('Type your name to approve this estimate'); if (!name) return Promise.resolve(new Response(JSON.stringify({ error: 'approver_name_required' }), { status: 422, headers: { 'content-type': 'application/json' } })); body.approverName = name.trim(); init.body = JSON.stringify(body); } } catch {} } return originalFetch(input, init); }; })();

(async () => { const token = new URLSearchParams(location.search).get('token'); if (!token) return; const response = await fetch('/api/public/customer-portal?token=' + encodeURIComponent(token)); if (!response.ok) return; const portal = await response.json(); const section = [...document.querySelectorAll('.section')].find((node) => node.querySelector('h2')?.textContent === 'Appointments'); if (!section) return; section.querySelectorAll('.row').forEach((row, index) => { const job = portal.jobs?.[index]; if (!job || (!job.completionNote && !job.photos?.length)) return; const evidence = document.createElement('div'); evidence.style = 'margin-top:8px;padding:8px;background:#f4f8fb;border-radius:8px;font-size:12px'; if (job.completionNote) { const note = document.createElement('div'); note.textContent = 'Technician note: ' + job.completionNote; evidence.append(note); } if (job.photos?.length) { const photos = document.createElement('div'); photos.style = 'margin-top:6px'; photos.textContent = 'Photo evidence: '; job.photos.forEach((photo, photoIndex) => { const link = document.createElement('a'); link.href = photo.url; link.target = '_blank'; link.rel = 'noopener'; link.textContent = photo.caption || `Photo ${photoIndex + 1}`; if (photoIndex) photos.append(document.createTextNode(' · ')); photos.append(link); }); evidence.append(photos); } row.querySelector('div')?.append(evidence); }); })();

(async () => { const token = new URLSearchParams(location.search).get('token'); if (!token) return; const response = await fetch('/api/public/customer-portal?token=' + encodeURIComponent(token)); if (!response.ok) return; const portal = await response.json(); const section = [...document.querySelectorAll('.section')].find((node) => node.querySelector('h2')?.textContent === 'Appointments'); if (!section) return; section.querySelectorAll('.row').forEach((row, index) => { const job = portal.jobs?.[index]; if (!job?.startsAt) return; try { const detail = row.querySelector('small'); if (detail) detail.textContent = `${new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short', timeZone: job.timeZone || undefined }).format(new Date(job.startsAt))} · ${job.technician || 'Technician pending'}`; } catch {} }); })();

(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;const response=await fetch('/api/public/customer-portal?token='+encodeURIComponent(token));if(!response.ok)return;const portal=await response.json();const section=[...document.querySelectorAll('.section')].find((node)=>node.querySelector('h2')?.textContent==='Estimates');if(!section)return;section.querySelectorAll('.row').forEach((row,index)=>{const estimate=portal.estimates?.[index];if(estimate?.subtotal===undefined)return;const detail=row.querySelector('small');if(detail)detail.textContent=`Subtotal $${estimate.subtotal.toFixed(2)} · Discount $${estimate.discount.toFixed(2)} · Tax $${estimate.tax.toFixed(2)} · Total ${estimate.value}`;});})();

</script><script>setTimeout(async()=>{if(!token)return;const response=await fetch(api);if(!response.ok)return;const portal=await response.json();const content=document.querySelector('#content');if(!content)return;const add=(title,items,main,sub,status)=>{if(!items?.length)return;const section=document.createElement('section');section.className='section';section.innerHTML='<h2>'+esc(title)+'</h2>'+items.map(item=>'<div class="row"><div>'+esc(main(item))+'<small>'+esc(sub(item))+'</small></div><span class="pill">'+esc(status(item))+'</span></div>').join('');content.append(section)};add('Messages',portal.messages,(item)=>item.channel||'Message',(item)=>item.message||'No message text',(item)=>item.status||item.direction||'');add('Requests',portal.requests,(item)=>item.type,(item)=>item.message||'No request detail',(item)=>item.status||'Open')},250);</script></body></html>
<script>setTimeout(()=>{const locationNode=document.querySelector('#location');const token=new URLSearchParams(location.search).get('token');if(!locationNode||!token)return;const button=document.createElement('button');button.className='request';button.textContent='Update service address';button.style.marginTop='8px';button.onclick=async()=>{const address=prompt('Primary service address',locationNode.firstChild?.textContent||'');if(!address?.trim())return;button.disabled=true;const response=await fetch('/api/public/customer-portal/location?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json','idempotency-key':crypto.randomUUID()},body:JSON.stringify({mode:'primary',address:address.trim()})});if(response.ok){locationNode.firstChild.textContent=address.trim();document.querySelector('#message').textContent='Service address updated.'}else document.querySelector('#message').textContent='Service address could not be updated.';button.disabled=false};locationNode.append(document.createElement('br'),button)},750);</script>
<script>setTimeout(()=>{const locationNode=document.querySelector('#location');const token=new URLSearchParams(location.search).get('token');if(!locationNode||!token)return;const button=document.createElement('button');button.className='request';button.textContent='Add service location';button.style.margin='8px 0 0 6px';button.onclick=async()=>{const address=prompt('Additional service address','');if(!address?.trim())return;const label=prompt('Location label','Secondary property')||'Service address';button.disabled=true;const response=await fetch('/api/public/customer-portal/location?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json','idempotency-key':crypto.randomUUID()},body:JSON.stringify({mode:'additional',label:label.trim(),address:address.trim()})});if(response.ok){document.querySelector('#message').textContent='Service location added.';window.location.reload()}else document.querySelector('#message').textContent='Service location could not be added.';button.disabled=false};locationNode.append(button)},800);</script>
<script>setTimeout(()=>{const token=new URLSearchParams(location.search).get('token');const section=[...document.querySelectorAll('.section')].find((node)=>node.querySelector('h2')?.textContent==='Service locations');if(!token||!section)return;section.querySelectorAll('.row').forEach((row)=>{const address=row.querySelector('small')?.textContent?.trim();if(!address||row.querySelector('.map-link'))return;const link=document.createElement('a');link.className='map-link';link.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address);link.target='_blank';link.rel='noopener';link.textContent='Open in maps';link.style='display:block;margin-top:6px';row.querySelector('div')?.append(link)})},950)</script>
