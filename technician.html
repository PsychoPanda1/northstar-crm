<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2c9d73" />
  <link rel="manifest" href="/northstar.webmanifest" />
  <title>Northstar Field Job</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f4f8f7}body{margin:0;padding:24px}.card{max-width:520px;margin:4vh auto;background:#fff;border:1px solid #dfe8e6;border-radius:18px;padding:24px;box-shadow:0 18px 45px #18304414}h1{font-size:25px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:#2c9d73}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.meta div{background:#f3f8f6;border-radius:10px;padding:13px}.label{display:block;color:#78908b;font-size:11px;margin-bottom:5px}.value{font-weight:700}.status{display:inline-block;border-radius:999px;padding:7px 11px;background:#e8f5ef;color:#25835e;font-size:12px;font-weight:800}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:10px;font:inherit;font-weight:800;cursor:pointer;background:#2c9d73;color:#fff}button.secondary{background:#eaf2ef;color:#237b5b}button:disabled{opacity:.5;cursor:wait}textarea{width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;font:inherit;min-height:90px;margin-top:14px}#message{font-size:13px;color:#6d7c84;min-height:20px;margin-top:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">NORTHSTAR FIELD WORKSPACE</div>
    <h1 id="service">Loading job…</h1>
    <span class="status" id="status">Loading</span>
    <section class="meta"><div><span class="label">Customer</span><span class="value" id="customer">—</span></div><div><span class="label">Service address</span><span class="value" id="location">—</span><a id="map-link" href="#" target="_blank" rel="noopener" hidden>Open in maps</a></div><div><span class="label">Appointment</span><span class="value" id="time">—</span></div><div><span class="label">Technician</span><span class="value" id="technician">—</span></div></section>
    <button class="secondary" id="en-route">Mark en route</button>
    <button class="secondary" id="in-progress">Start work</button>
    <button class="secondary" id="clock-in">Clock in</button>
    <button class="secondary" id="clock-out" disabled>Clock out</button>
    <small id="clock-summary" style="display:block;color:#78908b;margin-top:8px"></small>
    <button class="secondary" id="share-location" type="button">Start live location</button>
    <small id="location-summary" style="display:block;color:#78908b;margin-top:8px"></small>
    <div id="checklist"></div>
    <div id="notes"></div>
    <div style="margin-top:18px;font-weight:800;font-size:13px">Photo evidence</div><input id="photo-url" type="url" placeholder="https://... photo URL" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><input id="photo-caption" type="text" placeholder="Caption" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><button class="secondary" id="add-photo">Attach photo evidence</button><div id="photos"></div>
   <div style="margin-top:18px;font-weight:800;font-size:13px">Field estimate</div><select id="estimate-catalog" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit"><option value="">Custom service</option></select><input id="estimate-service" type="text" placeholder="Discovered service or repair" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><input id="estimate-amount" type="number" min="0.01" step="0.01" placeholder="Amount" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><textarea id="estimate-note" placeholder="Finding or recommendation"></textarea><button class="secondary" id="create-estimate">Save field estimate</button>
    <div style="margin-top:18px;font-weight:800;font-size:13px">Field finding</div><input id="finding-title" type="text" placeholder="Issue or opportunity" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><select id="finding-severity" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit"><option>Medium</option><option>Low</option><option>High</option><option>Safety</option></select><textarea id="finding-note" placeholder="What did you find onsite?"></textarea><input id="finding-recommendation" type="text" placeholder="Recommended next step (optional)" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><button class="secondary" id="save-finding">Save field finding</button><div id="findings"></div>
    <div style="margin-top:18px;font-weight:800;font-size:13px">Equipment record</div><input id="asset-name" type="text" placeholder="Equipment name" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><input id="asset-serial" type="text" placeholder="Model or serial number" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><input id="asset-installed" type="text" placeholder="Installed date or approximate age" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><input id="asset-warranty" type="date" title="Warranty through" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><button class="secondary" id="save-asset">Save equipment record</button><div id="assets"></div>
    <div style="margin-top:18px;font-weight:800;font-size:13px">Job form</div><input id="form-name" type="text" placeholder="Form name (e.g. safety inspection)" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><select id="form-result" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit"><option>Pass</option><option>Needs follow-up</option><option>Fail</option><option>Not applicable</option></select><textarea id="form-notes" placeholder="Form notes and observations"></textarea><input id="form-signature" type="text" placeholder="Customer acknowledgment (optional)" style="width:100%;box-sizing:border-box;border:1px solid #d8e4e0;border-radius:10px;padding:12px;margin-top:8px;font:inherit" /><button class="secondary" id="save-form">Submit job form</button><div id="forms"></div>
    <textarea id="note" placeholder="Required completion note: work performed, customer handoff, or follow-up needed."></textarea>
    <button id="complete">Complete job</button>
    <button class="secondary" id="collect-payment">Collect payment</button>
    <button class="secondary" id="log-time">Log time</button>
    <button class="secondary" id="use-material">Record material used</button>
    <div id="message"></div>
  </main>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/northstar-sw.js', { scope: '/' }).catch(() => {});</script>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const queueKey = `northstar-field-queue:${(token || 'missing').slice(-24)}`;
    const readQueue = () => { try { return JSON.parse(localStorage.getItem(queueKey) || '[]'); } catch { return []; } };
    const writeQueue = (items) => localStorage.setItem(queueKey, JSON.stringify(items.slice(-50)));
    const message = (value) => { document.querySelector('#message').textContent = value; };
    const rawApi = (path, options = {}) => fetch(`${path}?token=${encodeURIComponent(token || '')}`, { ...options, headers: { 'content-type': 'application/json', ...(options.headers || {}) } });
    const queueSafeOptions = (options = {}) => { if (options.method !== 'POST') return options; const headers = { ...(options.headers || {}) }; if (!headers['idempotency-key']) headers['idempotency-key'] = crypto.randomUUID(); return { ...options, headers }; };
    const flushQueue = async () => {
      const pending = readQueue();
      if (!pending.length || !navigator.onLine) return;
      const remaining = [];
      const conflicts = [];
      for (const item of pending) {
        try { const response = await rawApi(item.path, item.options); if (!response.ok) { if ([400, 401, 403, 409, 422].includes(response.status)) conflicts.push(item); else remaining.push(item); } }
        catch { remaining.push(item); }
      }
      writeQueue(remaining);
      if (conflicts.length) message(`${conflicts.length} offline update${conflicts.length === 1 ? '' : 's'} need review after a conflict or expired link.`);
      else if (!remaining.length) message('Offline field updates synchronized.');
    };
    const api = async (path, options = {}) => {
      const safeOptions = queueSafeOptions(options);
      try { return await rawApi(path, safeOptions); }
      catch (error) {
        if (safeOptions.method !== 'POST') throw error;
        writeQueue([...readQueue(), { path, options: safeOptions, queuedAt: new Date().toISOString() }]);
        message('Connection unavailable. Field update saved on this device.');
        return new Response(JSON.stringify({ offline: true }), { status: 202, headers: { 'content-type': 'application/json' } });
      }
    };
    window.addEventListener('online', flushQueue);
    const set = (id, value) => { document.querySelector(`#${id}`).textContent = value || '—'; };
   const renderChecklist = (items) => { document.querySelector('#checklist').innerHTML = items.length ? `<div style="margin:18px 0 4px;font-weight:800;font-size:13px">Required work steps</div>${items.map((item,index)=>`<label style="display:block;padding:9px 0;font-size:13px"><input type="checkbox" data-check-index="${index}" ${item.completed?'checked':''} /> ${item.label}</label>`).join('')}` : ''; document.querySelectorAll('[data-check-index]').forEach((box)=>box.onchange=async()=>{box.disabled=true;const r=await api('/api/public/technician-job/checklist',{method:'POST',body:JSON.stringify({index:Number(box.dataset.checkIndex),completed:box.checked})});if(!r.ok){box.checked=!box.checked;message('Could not update checklist.')}box.disabled=false;}); };
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'\"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '\"': '&quot;' }[character]));
   const renderFindings = (items) => { document.querySelector('#findings').innerHTML = (items || []).map((finding) => `<div style="margin-top:10px;padding:10px;background:#fff7e6;border-radius:10px"><strong>${escapeHtml(finding.title)} · ${escapeHtml(finding.severity)}</strong><div style="margin-top:4px">${escapeHtml(finding.note)}</div>${finding.recommendation ? `<small style="display:block;color:#78908b;margin-top:4px">Next: ${escapeHtml(finding.recommendation)}</small>` : ''}</div>`).join(''); };
   const renderNotes = (items) => { document.querySelector('#notes').innerHTML = (items || []).length ? `<div style="margin-top:18px;font-weight:800;font-size:13px">Office handoff notes</div>${items.map((note) => `<div style="margin-top:8px;padding:10px;background:#fffbea;border:1px solid #f2e7b5;border-radius:10px"><strong>${escapeHtml(note.author || 'Office')}</strong><small style="display:block;color:#78908b;margin-top:3px">${new Date(note.createdAt).toLocaleString()}</small><div style="margin-top:5px">${escapeHtml(note.note)}</div></div>`).join('')}` : ''; };
   const renderAssets = (items) => { document.querySelector('#assets').innerHTML = (items || []).map((asset) => `<div style="margin-top:10px;padding:10px;background:#f3f8f6;border-radius:10px"><strong>${escapeHtml(asset.name)}</strong><div>${escapeHtml(asset.serial)} · ${escapeHtml(asset.installed)}</div>${asset.warrantyThrough ? `<small style="display:block;color:#78908b">Warranty through ${escapeHtml(asset.warrantyThrough)}</small>` : ''}</div>`).join(''); };
    const renderForms = (required, items) => { const requiredMarkup = (required || []).length ? `<div style="margin-top:18px;font-weight:800;font-size:13px">Required forms</div>${required.map((form) => `<div style="margin-top:8px;padding:9px 10px;background:${form.completed ? '#eaf6ef' : '#fff4e5'};border-radius:10px;font-size:13px"><strong>${escapeHtml(form.formName)}</strong> · ${form.completed ? 'Complete' : 'Outstanding'}</div>`).join('')}` : ''; document.querySelector('#forms').innerHTML = requiredMarkup + (items || []).map((form) => `<div style="margin-top:10px;padding:10px;background:#eef3ff;border-radius:10px"><strong>${escapeHtml(form.formName)} · ${escapeHtml(form.result)}</strong><div>${escapeHtml(form.notes)}</div>${form.customerSignature ? `<small style="display:block;color:#78908b">Acknowledged by ${escapeHtml(form.customerSignature)}</small>` : ''}</div>`).join(''); };
    const renderPhotos = (items) => { document.querySelector('#photos').innerHTML = (items || []).map((photo) => `<div style="margin-top:10px;padding:10px;background:#f3f8f6;border-radius:10px"><a href="${photo.url}" target="_blank" rel="noopener">${photo.caption}</a><small style="display:block;color:#78908b">${new Date(photo.capturedAt).toLocaleString()}</small></div>`).join(''); };
    async function load() { if (!token) { message('This technician link is missing.'); return; } const response = await api('/api/public/technician-job'); if (!response.ok) { message('This job link is invalid or expired.'); return; } const job = await response.json(); const address = String(job.location || 'Address pending').trim(); set('service', job.service); set('customer', job.customer); set('location', address); const mapLink = document.querySelector('#map-link'); if (mapLink) { mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`; mapLink.hidden = !address || address === 'Address pending'; } set('time', job.time); set('technician', job.technician); set('status', job.status); renderChecklist(job.checklist || []); renderNotes(job.notes || []); renderPhotos(job.photos || []); renderFindings(job.findings || []); renderAssets(job.assets || []); renderForms(job.requiredForms || [], job.forms || []); const catalogSelect = document.querySelector('#estimate-catalog'); catalogSelect.innerHTML = '<option value="">Custom service</option>'; (job.catalog || []).forEach((item) => { const option = document.createElement('option'); option.value = item.id; option.textContent = `${item.name} · ${item.priceFrom || 'Price pending'}`; option.dataset.name = item.name; option.dataset.amount = item.priceFrom?.match(/[0-9]+(?:\\.[0-9]+)?/)?.[0] || ''; catalogSelect.append(option); }); catalogSelect.onchange = () => { const option = catalogSelect.selectedOptions[0]; if (!option?.value) return; document.querySelector('#estimate-service').value = option.dataset.name || ''; document.querySelector('#estimate-amount').value = option.dataset.amount || ''; }; document.querySelector('#en-route').disabled = ['En route','In progress','Completed','Canceled'].includes(job.status); document.querySelector('#in-progress').disabled = ['In progress','Completed','Canceled'].includes(job.status); document.querySelector('#complete').disabled = ['Completed','Canceled'].includes(job.status); if (job.completionNote) document.querySelector('#note').value = job.completionNote; }
    async function update(status) { const button = document.querySelector(status === 'En route' ? '#en-route' : '#in-progress'); button.disabled = true; const response = await api('/api/public/technician-job/status', { method:'POST', body:JSON.stringify({ status }) }); if (!response.ok) { message('Could not update job status.'); button.disabled = false; return; } if (response.status === 202) return; message(`Job marked ${status.toLowerCase()}.`); load(); }
   document.querySelector('#add-photo').onclick = async () => { const button = document.querySelector('#add-photo'); const photoUrl = document.querySelector('#photo-url').value.trim(); const caption = document.querySelector('#photo-caption').value.trim(); if (!photoUrl.startsWith('https://')) { message('Use an HTTPS photo URL.'); return; } button.disabled = true; const response = await api('/api/public/technician-job/photo', { method:'POST', body:JSON.stringify({ photoUrl, caption }) }); button.disabled = false; if (!response.ok) { message('Could not attach photo evidence.'); return; } if (response.status === 202) return; document.querySelector('#photo-url').value = ''; document.querySelector('#photo-caption').value = ''; message('Photo evidence attached.'); load(); };
   document.querySelector('#save-finding').onclick = async () => { const button = document.querySelector('#save-finding'); const title = document.querySelector('#finding-title').value.trim(); const severity = document.querySelector('#finding-severity').value; const note = document.querySelector('#finding-note').value.trim(); const recommendation = document.querySelector('#finding-recommendation').value.trim(); if (title.length < 2 || note.length < 2) { message('Add a finding title and onsite note.'); return; } button.disabled = true; const response = await api('/api/public/technician-job/finding', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ title, severity, note, recommendation }) }); button.disabled = false; if (!response.ok) { message('Could not save the field finding.'); return; } if (response.status === 202) return; document.querySelector('#finding-title').value = ''; document.querySelector('#finding-note').value = ''; document.querySelector('#finding-recommendation').value = ''; message('Field finding saved for owner review.'); load(); };
   document.querySelector('#save-asset').onclick = async () => { const button = document.querySelector('#save-asset'); const name = document.querySelector('#asset-name').value.trim(); const serial = document.querySelector('#asset-serial').value.trim(); const installed = document.querySelector('#asset-installed').value.trim(); const warrantyThrough = document.querySelector('#asset-warranty').value; if (name.length < 2 || serial.length < 2 || installed.length < 2) { message('Add equipment name, model or serial, and install details.'); return; } button.disabled = true; const response = await api('/api/public/technician-job/asset', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ name, serial, installed, ...(warrantyThrough ? { warrantyThrough } : {}) }) }); button.disabled = false; if (!response.ok) { message('Could not save the equipment record.'); return; } if (response.status === 202) return; document.querySelector('#asset-name').value = ''; document.querySelector('#asset-serial').value = ''; document.querySelector('#asset-installed').value = ''; document.querySelector('#asset-warranty').value = ''; message('Equipment record added to customer history.'); load(); };
    document.querySelector('#save-form').onclick = async () => { const button = document.querySelector('#save-form'); const formName = document.querySelector('#form-name').value.trim(); const result = document.querySelector('#form-result').value; const notes = document.querySelector('#form-notes').value.trim(); const customerSignature = document.querySelector('#form-signature').value.trim(); if (formName.length < 2 || notes.length < 2) { message('Add a form name and field notes.'); return; } button.disabled = true; const response = await api('/api/public/technician-job/form', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ formName, result, notes, customerSignature }) }); button.disabled = false; if (!response.ok) { message('Could not submit the job form.'); return; } if (response.status === 202) return; document.querySelector('#form-name').value = ''; document.querySelector('#form-notes').value = ''; document.querySelector('#form-signature').value = ''; message('Job form submitted for office review.'); load(); };
    document.querySelector('#create-estimate').onclick = async () => { const button = document.querySelector('#create-estimate'); const service = document.querySelector('#estimate-service').value.trim(); const amount = Number(document.querySelector('#estimate-amount').value); const note = document.querySelector('#estimate-note').value.trim(); const catalogItemId = document.querySelector('#estimate-catalog').value || null; if (service.length < 2 || !Number.isFinite(amount) || amount <= 0) { message('Add a service and a valid estimate amount.'); return; } button.disabled = true; const response = await api('/api/public/technician-job/estimate', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ service, amount, note, ...(catalogItemId ? { catalogItemId } : {}) }) }); button.disabled = false; if (!response.ok) { message('Could not create the field estimate.'); return; } if (response.status === 202) return; document.querySelector('#estimate-service').value = ''; document.querySelector('#estimate-amount').value = ''; document.querySelector('#estimate-note').value = ''; message('Field estimate created for owner review.'); };
    document.querySelector('#collect-payment').onclick = async () => { const button = document.querySelector('#collect-payment'); const amount = Number(window.prompt('Payment amount')); const method = window.prompt('Payment method: Card or ACH', 'Card'); if (!Number.isFinite(amount) || amount <= 0 || !['Card', 'ACH'].includes(method)) return; button.disabled = true; const response = await api('/api/public/technician-job/payment-intent', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ amount, method }) }); button.disabled = false; if (!response.ok) { message('Could not start payment. This job may not have an open invoice.'); return; } if (response.status === 202) return; message('Payment submitted for provider confirmation.'); };
    const loadClock = async () => { const response = await api('/api/public/technician-job/clock'); if (!response.ok) return; const clock = await response.json(); document.querySelector('#clock-in').disabled = clock.active || Boolean(clock.clockOutAt); document.querySelector('#clock-out').disabled = !clock.active; document.querySelector('#clock-summary').textContent = clock.fieldMinutes ? `Tracked field time: ${clock.fieldMinutes} minutes` : clock.active ? 'Clock is running.' : 'No active clock.'; };
    const clock = async (action) => { const button = document.querySelector(action === 'in' ? '#clock-in' : '#clock-out'); button.disabled = true; const response = await api('/api/public/technician-job/clock', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ action }) }); if (!response.ok) { message('Could not update the field clock. Start the job before clocking in.'); await loadClock(); return; } message(action === 'in' ? 'Field clock started.' : 'Field clock stopped.'); await loadClock(); };
    document.querySelector('#en-route').onclick = () => update('En route'); document.querySelector('#in-progress').onclick = async () => { await update('In progress'); await loadClock(); }; document.querySelector('#clock-in').onclick = () => clock('in'); document.querySelector('#clock-out').onclick = () => clock('out'); document.querySelector('#complete').onclick = async () => { const note = document.querySelector('#note').value.trim(); if (note.length < 3) { message('Add a completion note before finishing.'); return; } const customerAcknowledgedBy = window.prompt('Customer acknowledgment name (optional)', '')?.trim() || ''; const button = document.querySelector('#complete'); button.disabled = true; const response = await api('/api/public/technician-job/complete', { method:'POST', headers:{'idempotency-key':crypto.randomUUID()}, body:JSON.stringify({ note, customerAcknowledgedBy }) }); if (!response.ok) { message('Could not complete this job.'); button.disabled = false; return; } if (response.status === 202) return; message('Job completed and customer timeline updated.'); load(); }; load(); loadClock(); flushQueue();
    document.querySelector('#log-time').onclick = async () => { const hours = Number(window.prompt('Hours worked on this job', '1')); if (!Number.isFinite(hours) || hours <= 0) return; const button = document.querySelector('#log-time'); button.disabled = true; const response = await api('/api/public/technician-job/labor', { method:'POST', body:JSON.stringify({ hours }) }); button.disabled = false; if (!response.ok) { message('Could not log field time.'); return; } message(response.status === 202 ? 'Time saved for synchronization.' : 'Field time logged.'); };
    document.querySelector('#use-material').onclick = async () => { const jobResponse = await api('/api/public/technician-job'); if (!jobResponse.ok) { message('Could not load available materials.'); return; } const job = await jobResponse.json(); const materials = job.materials || []; if (!materials.length) { message('No stocked materials are available.'); return; } const selection = Number(window.prompt(`Material number:\n${materials.map((item,index)=>`${index + 1}. ${item.name} (${item.onHand} ${item.unit} available)`).join('\n')}`, '1')); if (!Number.isInteger(selection) || selection < 1 || selection > materials.length) return; const quantity = Number(window.prompt(`Quantity of ${materials[selection - 1].name}`, '1')); if (!Number.isInteger(quantity) || quantity <= 0) return; const locations = job.inventoryLocations || []; const locationSelection = locations.length ? Number(window.prompt(`Stock location number (optional):\n${locations.map((item,index)=>`${index + 1}. ${item.name} (${item.type})`).join('\\n')}`, '1')) : 0; if (locationSelection && (!Number.isInteger(locationSelection) || locationSelection < 1 || locationSelection > locations.length)) return; const locationId = locationSelection ? locations[locationSelection - 1].id : ''; const button = document.querySelector('#use-material'); button.disabled = true; const response = await api('/api/public/technician-job/materials', { method:'POST', body:JSON.stringify({ materialId: materials[selection - 1].id, quantity, ...(locationId ? { locationId } : {}) }) }); button.disabled = false; if (!response.ok) { message('Could not record material usage. Check available stock.'); return; } message(response.status === 202 ? 'Material usage saved for synchronization.' : 'Material usage recorded.'); };
  </script><script>
  (async () => { const token = new URLSearchParams(location.search).get('token'); if (!token) return; const response = await fetch('/api/public/technician-job?token=' + encodeURIComponent(token)); if (!response.ok) return; const job = await response.json(); if (!job.visits?.length) return; const section = document.createElement('section'); section.id = 'visits'; section.style = 'margin-top:18px'; section.innerHTML = '<div style="font-weight:800;font-size:13px;margin-bottom:8px">Work-order visits</div>'; job.visits.forEach((visit) => { const row = document.createElement('div'); row.style = 'padding:10px 0;border-bottom:1px solid #e8efed;font-size:13px'; row.innerHTML = `<strong>Visit ${visit.sequence}</strong><br><span style="color:#6d7c84">${visit.time} · ${visit.status}</span>`; if (visit.technician === job.technician && !['Completed', 'Canceled'].includes(visit.status)) { const button = document.createElement('button'); button.className = 'secondary'; button.textContent = visit.status === 'Scheduled' ? 'Start visit' : visit.status === 'In progress' ? 'Complete visit' : 'Mark in progress'; button.onclick = async () => { const status = visit.status === 'Scheduled' ? 'En route' : visit.status === 'En route' ? 'In progress' : 'Completed'; button.disabled = true; const result = await fetch('/api/public/technician-job/visit-status?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ visitId: visit.id, status }) }); if (result.ok) { message(`Visit ${visit.sequence} marked ${status.toLowerCase()}.`); location.reload(); } else { button.disabled = false; message('Could not update this visit.'); } }; row.append(button); } section.append(row); }); document.querySelector('#checklist')?.after(section); })();
  </script><script>
  const shareLocation = () => { const button = document.querySelector('#share-location'); const summary = document.querySelector('#location-summary'); if (!navigator.geolocation) { summary.textContent = 'Location sharing is unavailable on this device.'; return; } button.disabled = true; navigator.geolocation.getCurrentPosition(async (position) => { const response = await api('/api/public/technician-job/location', { method: 'POST', body: JSON.stringify({ latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy }) }); button.disabled = false; summary.textContent = response.ok ? `Location shared at ${new Date().toLocaleTimeString()}.` : 'Location could not be shared.'; }, () => { button.disabled = false; summary.textContent = 'Location permission was not granted.'; }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 10000 }); }; document.querySelector('#share-location').onclick = shareLocation;
  </script>
  <script>
    (() => {
      const button = document.querySelector('#share-location');
      const summary = document.querySelector('#location-summary');
      if (!button || !summary) return;
      let timer = null;
      let enabled = false;
      const active = () => ['En route', 'In progress'].includes(document.querySelector('#status')?.textContent);
      const stop = (text = 'Live location is off.') => { if (timer) clearInterval(timer); timer = null; enabled = false; button.disabled = false; button.textContent = 'Start live location'; summary.textContent = text; };
      const send = (silent = false) => { if (!active()) { if (!silent) summary.textContent = 'Start live location after marking the job en route.'; return; } if (!navigator.geolocation) { summary.textContent = 'Location sharing is unavailable on this device.'; return; } button.disabled = true; navigator.geolocation.getCurrentPosition(async (position) => { const response = await api('/api/public/technician-job/location', { method: 'POST', body: JSON.stringify({ latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy }) }); button.disabled = false; if (response.ok) summary.textContent = `Location shared at ${new Date().toLocaleTimeString()}.`; else if (!silent) summary.textContent = 'Location could not be shared.'; }, () => { button.disabled = false; if (!silent) summary.textContent = 'Location permission was not granted.'; }, { enableHighAccuracy: true, maximumAge: 30000, timeout: 10000 }); };
      button.onclick = () => { if (timer) { stop(); return; } enabled = true; button.textContent = 'Stop live location'; send(); timer = setInterval(() => { if (!enabled || !active()) { stop('Live location stopped because this job is no longer active.'); return; } if (!document.hidden) send(true); }, 60000); };
      document.addEventListener('visibilitychange', () => { if (!document.hidden && timer && enabled) send(true); });
      window.addEventListener('beforeunload', () => stop());
    })();
  </script>
