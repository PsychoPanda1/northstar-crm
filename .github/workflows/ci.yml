name: Northstar CRM checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: northstar-crm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run syntax checks
        run: npm run check
      - name: Check setup utilities
        run: node --check scripts/generate-owner-digest.mjs
      - name: Run isolated smoke suite
        run: npm run test:smoke
      - name: Build container image
        run: docker build --tag northstar-crm:ci .
