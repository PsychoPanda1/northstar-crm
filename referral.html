<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refer a friend</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#183044;background:#f4f8f7}body{margin:0;padding:22px}.card{max-width:520px;margin:6vh auto;background:#fff;border:1px solid #dfe8e6;border-radius:18px;padding:28px;box-shadow:0 18px 45px #18304414}h1{font-size:28px;margin:8px 0}.eyebrow{color:#2c9d73;font-size:11px;font-weight:800;letter-spacing:1.5px}.intro{color:#72828b;font-size:14px;line-height:1.5}form{display:grid;gap:14px;margin-top:24px}label{display:grid;gap:6px;font-size:12px;font-weight:700}input,textarea{border:1px solid #d8e4e0;border-radius:8px;padding:11px;font:inherit}textarea{min-height:90px}button{border:0;border-radius:9px;padding:12px;background:#2c9d73;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.5}#message{min-height:20px;color:#71818a;font-size:13px;margin-top:16px}</style></head><body><main class="card"><div class="eyebrow">A FRIEND SENT YOU</div><h1 id="title">Request service</h1><p class="intro">Tell us what you need and the local service team will follow up.</p><form id="form"><label>Name<input name="name" required autocomplete="name"></label><label>Phone<input name="phone" autocomplete="tel"></label><label>Email<input name="email" type="email" autocomplete="email"></label><label>What do you need?<textarea name="message" maxlength="500"></textarea><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-10000px" aria-hidden="true"></label><button>Send request</button></form><div id="message" role="status" aria-live="polite"></div></main><script>const token=new URLSearchParams(location.search).get('token');const form=document.querySelector('#form');const message=(v)=>document.querySelector('#message').textContent=v;const api='/api/public/referral?token='+encodeURIComponent(token||'');fetch(api).then(r=>r.ok?r.json():Promise.reject()).then(d=>{document.querySelector('#title').textContent=`Request service from ${d.businessName}`;}).catch(()=>{message('This referral link is invalid or expired.');form.hidden=true;});form.addEventListener('submit',async(e)=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const body=Object.fromEntries(new FormData(form));const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json','idempotency-key':crypto.randomUUID()},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'failed');form.hidden=true;message('Request received. The service team will follow up shortly.');}catch{message('We could not submit the request. Check your contact information and try again.');button.disabled=false;}});</script></body></html>
