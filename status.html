<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Check your service appointment status." />
    <title>Appointment status · Northstar</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#193044;background:#f5f8f7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(480px,100%);background:#fff;border:1px solid #e1e9e6;border-radius:18px;padding:32px;box-shadow:0 18px 50px #19304412}.brand{color:#23845d;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.kicker{color:#879994;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:28px 0 8px}.status{display:inline-flex;align-items:center;gap:8px;background:#e8f7ef;color:#23845d;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}.status:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}.detail{border-top:1px solid #edf1ef;margin-top:26px;padding-top:20px;display:grid;gap:16px}.detail div{display:flex;justify-content:space-between;gap:20px}.detail span{color:#879994;font-size:12px}.detail strong{text-align:right;font-size:13px}.message{color:#71827d;font-size:14px;line-height:1.55;margin:18px 0 0}.error{color:#ad4c4c}.loading{color:#71827d}
    </style>
  </head>
  <body>
    <main class="card" aria-live="polite"><div class="brand">Northstar service cloud</div><div id="content" class="loading"><div class="kicker">Appointment status</div><h1>Loading your appointment…</h1></div></main>
    <script>
      const content = document.querySelector('#content');
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
      const token = new URLSearchParams(location.search).get('token');
      if (!token) { content.innerHTML = '<div class="kicker">Appointment status</div><h1>Link unavailable</h1><p class="message error">This status link is missing or incomplete. Please contact the service team for a new link.</p>'; }
      else fetch(`/api/public/job-status?token=${encodeURIComponent(token)}`).then(async (response) => { const body = await response.json(); if (!response.ok) throw new Error(body.error); let scheduled = body.time; try { if (body.appointment?.startsAt) scheduled = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short', timeZone: body.appointment.timeZone || undefined }).format(new Date(body.appointment.startsAt)); } catch {} let enRoute = ''; try { if (body.enRouteAt) enRoute = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(body.enRouteAt)); } catch {} content.innerHTML = `<div class="kicker">${escapeHtml(body.service)}</div><h1>Your appointment</h1><div class="status">${escapeHtml(body.status)}</div><div class="detail"><div><span>Scheduled</span><strong>${escapeHtml(scheduled)}</strong></div><div><span>Service address</span><strong>${escapeHtml(body.location)}</strong></div>${body.technician ? `<div><span>Technician</span><strong>${escapeHtml(body.technician)}</strong></div>` : ''}${enRoute ? `<div><span>Technician en route</span><strong>${escapeHtml(enRoute)}</strong></div>` : ''}</div><p class="message">We’ll keep this page updated as your appointment moves through the service process.</p>${body.reviewUrl ? `<p class="message"><a href="${escapeHtml(body.reviewUrl)}" target="_blank" rel="noopener">Leave a review</a> · link expires in ${escapeHtml(body.reviewLinkExpiresInHours || 72)} hours.</p>` : ''}`; }).catch(() => { content.innerHTML = '<div class="kicker">Appointment status</div><h1>Link unavailable</h1><p class="message error">This status link has expired or is no longer available. Please contact the service team.</p>'; });
    </script>
    <script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');const retryKey=(scope,payload)=>{const storageKey=`northstar-status-retry-${token}-${scope}-${JSON.stringify(payload)}`;const stored=sessionStorage.getItem(storageKey);if(stored)return stored;const next=crypto.randomUUID();sessionStorage.setItem(storageKey,next);return next};if(!token)return;const response=await fetch('/api/public/job-status?token='+encodeURIComponent(token));if(!response.ok)return;const body=await response.json();if(['Completed','Canceled'].includes(body.status))return;const content=document.querySelector('#content');if(!content||content.querySelector('[data-cancel-status]'))return;const button=document.createElement('button');button.textContent='Cancel appointment';button.dataset.cancelStatus='true';button.style='margin-top:12px';button.onclick=async()=>{const reason=prompt('Why do you need to cancel?','Schedule changed.');if(!reason||reason.trim().length<3)return;button.disabled=true;const result=await fetch('/api/public/job-status/cancel?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json','idempotency-key':retryKey('cancel',reason.trim())},body:JSON.stringify({reason})});if(result.ok){location.reload()}else{button.disabled=false;alert('This appointment could not be canceled. Please contact the service team.')}};content.append(button)},1200);</script>
  </body>
</html>
<script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');const retryKey=(scope,payload)=>{const storageKey=`northstar-status-retry-${token}-${scope}-${JSON.stringify(payload)}`;const stored=sessionStorage.getItem(storageKey);if(stored)return stored;const next=crypto.randomUUID();sessionStorage.setItem(storageKey,next);return next};if(!token)return;const response=await fetch('/api/public/job-status?token='+encodeURIComponent(token));if(!response.ok)return;const body=await response.json();if(!body.availableRescheduleSlots?.length)return;const content=document.querySelector('#content');if(!content)return;const wrap=document.createElement('div');wrap.style='margin-top:18px;display:flex;gap:8px;flex-wrap:wrap';const select=document.createElement('select');select.innerHTML='<option value="">Choose a new time</option>'+body.availableRescheduleSlots.map(slot=>'<option value="'+escapeHtml(slot.id)+'">'+escapeHtml(slot.label)+'</option>').join('');const button=document.createElement('button');button.textContent='Reschedule appointment';button.onclick=async()=>{if(!select.value)return;button.disabled=true;const result=await fetch('/api/public/job-status/reschedule?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json','idempotency-key':retryKey('reschedule',select.value)},body:JSON.stringify({slotId:select.value})});if(result.ok){location.reload()}else{button.disabled=false;alert('That time is no longer available. Please choose another slot.')}};wrap.append(select,button);content.append(wrap)},900);</script>
    <script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;const response=await fetch('/api/public/job-status?token='+encodeURIComponent(token));if(!response.ok)return;const body=await response.json();if(!body.visits?.length)return;const content=document.querySelector('#content');if(!content)return;const wrap=document.createElement('div');wrap.className='detail';const progress=body.visitSummary?`Visit progress: ${body.visitSummary.completed}/${body.visitSummary.total} completed`:'';wrap.innerHTML=`<div><span>${escapeHtml(progress||'Visits')}</span><strong>${body.visits.map((visit)=>escapeHtml(`${visit.sequence}. ${visit.status}`)).join(' · ')}</strong></div>`;content.append(wrap)},1100);</script>
    <script>setTimeout(async()=>{const token=new URLSearchParams(location.search).get('token');if(!token)return;const response=await fetch('/api/public/job-status?token='+encodeURIComponent(token));if(!response.ok)return;const body=await response.json();if(!body.appointment?.startsAt||!body.appointment?.endsAt)return;const content=document.querySelector('#content');if(!content||content.querySelector('[data-calendar-link]'))return;const link=document.createElement('a');link.dataset.calendarLink='true';link.href='/api/public/job-status/calendar?token='+encodeURIComponent(token);link.textContent='Add to calendar';link.target='_blank';link.rel='noopener';link.style='display:inline-block;margin-top:16px;color:#23845d;font-weight:700';content.append(link)},1400);</script>
